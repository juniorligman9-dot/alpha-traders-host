<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Alpha Traders Host</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0b0f19;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 430px;
  background: #121827;
  border: 1px solid #20283a;
  border-radius: 16px;
  padding: 35px;
}

.logo {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 10px;
}

.logo span {
  color: #00d084;
}

.subtitle {
  text-align: center;
  color: #929bad;
  margin-bottom: 30px;
}

label {
  display: block;
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  padding: 14px;
  margin-bottom: 18px;
  background: #0b0f19;
  border: 1px solid #30394d;
  border-radius: 8px;
  color: white;
  font-size: 16px;
}

input:focus,
select:focus {
  outline: none;
  border-color: #00d084;
}

select {
  cursor: pointer;
}

option {
  background: #121827;
  color: white;
}

button {
  width: 100%;
  padding: 14px;
  background: #00d084;
  color: #07110f;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.message {
  text-align: center;
  margin-top: 18px;
  min-height: 24px;
  color: #929bad;
  line-height: 1.5;
}

.message.error {
  color: #ff8080;
}

.message.success {
  color: #00d084;
}

.links {
  text-align: center;
  margin-top: 22px;
}

.links a {
  color: #00d084;
  text-decoration: none;
}

.links a:hover {
  text-decoration: underline;
}

@media (max-width: 500px) {
  .box {
    padding: 28px 22px;
  }
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    ALPHA <span>TRADERS HOST</span>
  </div>

  <p class="subtitle">
    Create your account
  </p>


  <form id="registerForm">

    <label for="name">Full Name</label>

    <input
      type="text"
      id="name"
      placeholder="Your name"
      required
    >


    <label for="role">
      Account Type
    </label>

    <select
      id="role"
      required
    >
      <option value="" selected disabled>
        Select account type
      </option>

      <option value="client">
        Client
      </option>

      <option value="mentor">
        Mentor
      </option>
    </select>


    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      required
    >


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Create a password"
      minlength="8"
      required
    >


    <label for="confirm">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirm"
      placeholder="Confirm password"
      minlength="8"
      required
    >


    <button
      type="submit"
      id="registerButton"
    >
      Create Account
    </button>

  </form>


  <div
    id="message"
    class="message"
  ></div>


  <div class="links">

    <p>
      Already have an account?
    </p>

    <br>

    <a href="login.html">
      Sign In
    </a>

  </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

const registerForm =
  document.getElementById("registerForm");

const registerButton =
  document.getElementById("registerButton");

const message =
  document.getElementById("message");


function showMessage(text, type = "") {

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/*
==========================================
REGISTER ACCOUNT
==========================================
*/

registerForm.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();


    const fullName =
      document
        .getElementById("name")
        .value
        .trim();


    const role =
      document
        .getElementById("role")
        .value;


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const confirm =
      document
        .getElementById("confirm")
        .value;


    /*
    ======================================
    VALIDATE ROLE
    ======================================
    */

    if (
      role !== "client" &&
      role !== "mentor"
    ) {

      showMessage(
        "Please select Client or Mentor.",
        "error"
      );

      return;

    }


    /*
    ======================================
    VALIDATE PASSWORD
    ======================================
    */

    if (password !== confirm) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;

    }


    /*
    ======================================
    CHECK SUPABASE
    ======================================
    */

    if (
      typeof window.supabaseClient ===
      "undefined"
    ) {

      showMessage(
        "Supabase is not connected.",
        "error"
      );

      return;

    }


    registerButton.disabled =
      true;

    registerButton.textContent =
      "Creating Account...";


    showMessage(
      "Creating your account..."
    );


    try {

      /*
      ======================================
      CREATE AUTH ACCOUNT

      The database trigger will automatically
      create the profile.

      Client → approved
      Mentor → pending
      ======================================
      */

      const {
        data,
        error
      } =
        await window.supabaseClient
          .auth
          .signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name:
                  fullName,

                role:
                  role

              }

            }

          });


      if (error) {

        throw error;

      }


      if (!data?.user) {

        throw new Error(
          "Account could not be created."
        );

      }


      /*
      ======================================
      SUCCESS MESSAGE
      ======================================
      */

      if (role === "mentor") {

        showMessage(
          "Mentor application submitted successfully! Please check your email to confirm your account. Your mentor account will be available after administrator approval.",
          "success"
        );

      }
      else {

        showMessage(
          "Client account created successfully! Please check your email to confirm your account.",
          "success"
        );

      }


      registerForm.reset();


    }
    catch (error) {

      console.error(
        "Registration error:",
        error
      );


      showMessage(
        "Error: " +
        (
          error.message ||
          "Please try again."
        ),
        "error"
      );

    }
    finally {

      registerButton.disabled =
        false;

      registerButton.textContent =
        "Create Account";

    }

  }
);

</script>

</body>
</html>
