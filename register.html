<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Alpha Traders Host</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0b0f19;
  --card: #121827;
  --border: #30394d;
  --text: #ffffff;
  --muted: #929bad;
  --accent: #00d084;
  --accent-dark: #00a86b;
  --error: #ff6b6b;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border: 1px solid #20283a;
  border-radius: 20px;
  padding: 35px;
}

.logo {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.logo span {
  color: var(--accent);
}

.subtitle {
  text-align: center;
  color: var(--muted);
  margin-bottom: 30px;
  font-size: 16px;
  line-height: 1.5;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 16px;
  font-weight: 600;
}

input,
select {
  width: 100%;
  padding: 14px;
  margin-bottom: 18px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus,
select:focus {
  border-color: var(--accent);
}

select {
  cursor: pointer;
}

select option {
  background: #121827;
  color: white;
}

.role-info {
  background: #0d1422;
  border: 1px solid #263249;
  border-radius: 10px;
  padding: 14px;
  margin-top: -5px;
  margin-bottom: 20px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}

.role-info strong {
  color: var(--accent);
}

button {
  width: 100%;
  padding: 15px;
  background: var(--accent);
  color: #07110f;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover:not(:disabled) {
  background: var(--accent-dark);
  transform: translateY(-1px);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.links {
  text-align: center;
  margin-top: 25px;
  color: var(--muted);
}

.links p {
  margin-bottom: 10px;
}

a {
  color: var(--accent);
  text-decoration: none;
  font-weight: bold;
}

a:hover {
  text-decoration: underline;
}

.message {
  text-align: center;
  margin-top: 18px;
  color: var(--muted);
  min-height: 24px;
  line-height: 1.5;
}

.message.error {
  color: var(--error);
}

.message.success {
  color: var(--accent);
}

@media (max-width: 500px) {

  body {
    padding: 15px;
    align-items: flex-start;
  }

  .box {
    margin-top: 20px;
    padding: 30px 22px;
    border-radius: 16px;
  }

  .logo {
    font-size: 23px;
  }

}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    ALPHA <span>TRADERS HOST</span>
  </div>

  <p class="subtitle">
    Create your account and choose how you want to use the platform.
  </p>


  <form id="registerForm">

    <!-- FULL NAME -->

    <label for="name">
      Full Name
    </label>

    <input
      type="text"
      id="name"
      placeholder="Your full name"
      required
    >


    <!-- ACCOUNT TYPE -->

    <label for="role">
      Account Type
    </label>

    <select
      id="role"
      required
    >
      <option value="client">
        Client
      </option>

      <option value="mentor">
        Mentor
      </option>
    </select>


    <!-- ROLE INFORMATION -->

    <div
      class="role-info"
      id="roleInfo"
    >
      <strong>Client Account:</strong>
      You can access available services and features immediately after registration.
    </div>


    <!-- EMAIL -->

    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      autocomplete="email"
      required
    >


    <!-- PASSWORD -->

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Create a password"
      autocomplete="new-password"
      minlength="8"
      required
    >


    <!-- CONFIRM PASSWORD -->

    <label for="confirm">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirm"
      placeholder="Confirm your password"
      autocomplete="new-password"
      minlength="8"
      required
    >


    <!-- SUBMIT -->

    <button
      type="submit"
      id="registerButton"
    >
      Create Account
    </button>

  </form>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- LOGIN LINK -->

  <div class="links">

    <p>
      Already have an account?
    </p>

    <a href="login.html">
      Sign In
    </a>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

/*
==========================================
ELEMENTS
==========================================
*/

const registerForm =
  document.getElementById("registerForm");

const nameInput =
  document.getElementById("name");

const roleInput =
  document.getElementById("role");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const confirmInput =
  document.getElementById("confirm");

const message =
  document.getElementById("message");

const registerButton =
  document.getElementById("registerButton");

const roleInfo =
  document.getElementById("roleInfo");


/*
==========================================
UPDATE ROLE INFORMATION
==========================================
*/

roleInput.addEventListener(
  "change",
  function () {

    if (
      roleInput.value === "mentor"
    ) {

      roleInfo.innerHTML = `
        <strong>Mentor Account:</strong>
        Your account will be submitted for approval.
        You will only receive full mentor access after an administrator approves you.
      `;

    } else {

      roleInfo.innerHTML = `
        <strong>Client Account:</strong>
        You can access available services and features immediately after registration.
      `;

    }

  }
);


/*
==========================================
REGISTER ACCOUNT
==========================================
*/

registerForm.addEventListener(
  "submit",
  async function (e) {

    e.preventDefault();


    /*
    --------------------------------------
    GET VALUES
    --------------------------------------
    */

    const fullName =
      nameInput.value.trim();

    const role =
      roleInput.value;

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    const confirm =
      confirmInput.value;


    /*
    --------------------------------------
    RESET MESSAGE
    --------------------------------------
    */

    message.textContent = "";

    message.className =
      "message";


    /*
    --------------------------------------
    VALIDATE ROLE
    --------------------------------------
    */

    if (
      role !== "client" &&
      role !== "mentor"
    ) {

      message.textContent =
        "Please select a valid account type.";

      message.classList.add(
        "error"
      );

      return;

    }


    /*
    --------------------------------------
    VALIDATE PASSWORD
    --------------------------------------
    */

    if (
      password !== confirm
    ) {

      message.textContent =
        "Passwords do not match.";

      message.classList.add(
        "error"
      );

      return;

    }


    if (
      password.length < 8
    ) {

      message.textContent =
        "Password must be at least 8 characters.";

      message.classList.add(
        "error"
      );

      return;

    }


    /*
    --------------------------------------
    CHECK SUPABASE
    --------------------------------------
    */

    if (
      !window.supabaseClient
    ) {

      message.textContent =
        "Supabase is not connected. Please check supabase-config.js.";

      message.classList.add(
        "error"
      );

      return;

    }


    /*
    --------------------------------------
    LOADING STATE
    --------------------------------------
    */

    registerButton.disabled =
      true;

    registerButton.textContent =
      "Creating Account...";

    message.textContent =
      "Creating your account...";


    try {

      /*
      ====================================
      CREATE USER
      ====================================
      */

      const {
        data,
        error
      } =
        await window.supabaseClient
          .auth
          .signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name:
                  fullName,

                role:
                  role

              }

            }

          });


      /*
      ====================================
      HANDLE ERROR
      ====================================
      */

      if (error) {

        throw error;

      }


      /*
      ====================================
      SUCCESS
      ====================================
      */

      if (
        data.user
      ) {

        message.className =
          "message success";


        /*
        ----------------------------------
        MENTOR
        ----------------------------------
        */

        if (
          role === "mentor"
        ) {

          message.textContent =
            "Mentor account created successfully! Your account is now pending administrator approval. Please check your email if confirmation is required.";

        }


        /*
        ----------------------------------
        CLIENT
        ----------------------------------
        */

        else {

          message.textContent =
            "Client account created successfully! Please check your email if confirmation is required.";

        }


        /*
        ----------------------------------
        RESET FORM
        ----------------------------------
        */

        registerForm.reset();


        /*
        ----------------------------------
        REDIRECT TO LOGIN
        ----------------------------------
        */

        setTimeout(
          function () {

            window.location.href =
              "login.html";

          },
          3500
        );


      }

      else {

        throw new Error(
          "Unable to create the account."
        );

      }


    }


    catch (err) {

      console.error(
        "Registration error:",
        err
      );


      message.className =
        "message error";


      message.textContent =
        "Error: " +
        (
          err.message ||
          "Something went wrong. Please try again."
        );


      registerButton.disabled =
        false;

      registerButton.textContent =
        "Create Account";

    }

  }
);

</script>

</body>
</html>
