<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Create Account | Alpha Traders Host</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0b0f19;
  --card: #121827;
  --border: #30394d;
  --text: #ffffff;
  --muted: #929bad;
  --accent: #00d084;
  --danger: #ff6b6b;
  --warning: #f5b942;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 500px;
  background: var(--card);
  border: 1px solid #20283a;
  border-radius: 18px;
  padding: 38px;
}

.logo {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 10px;
}

.logo span {
  color: var(--accent);
}

.subtitle {
  text-align: center;
  color: var(--muted);
  margin-bottom: 30px;
  font-size: 16px;
}

form {
  display: flex;
  flex-direction: column;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 16px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 15px;
  margin-bottom: 20px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus,
select:focus {
  border-color: var(--accent);
}

select {
  cursor: pointer;
}

button {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  color: #07110f;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s ease;
}

button:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.message {
  text-align: center;
  margin-top: 18px;
  color: var(--muted);
  min-height: 24px;
  line-height: 1.5;
}

.message.error {
  color: var(--danger);
}

.message.success {
  color: var(--accent);
}

.message.warning {
  color: var(--warning);
}

.resend-box {
  display: none;
  margin-top: 15px;
}

.resend-box.show {
  display: block;
}

.resend-button {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  font-size: 15px;
}

.role-info {
  background: rgba(0, 208, 132, 0.08);
  border: 1px solid rgba(0, 208, 132, 0.25);
  color: var(--muted);
  border-radius: 10px;
  padding: 13px;
  margin-top: -8px;
  margin-bottom: 20px;
  font-size: 14px;
  line-height: 1.5;
}

.links {
  text-align: center;
  margin-top: 24px;
  color: var(--muted);
}

.links a {
  display: inline-block;
  margin-top: 10px;
  color: var(--accent);
  text-decoration: none;
  font-weight: bold;
}

.links a:hover {
  text-decoration: underline;
}

@media (max-width: 500px) {

  body {
    padding: 15px;
    align-items: flex-start;
  }

  .box {
    margin-top: 20px;
    padding: 30px 22px;
  }

  .logo {
    font-size: 23px;
  }

}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    ALPHA <span>TRADERS HOST</span>
  </div>

  <p class="subtitle">
    Create your account
  </p>


  <form id="registerForm">

    <label for="name">
      Full Name
    </label>

    <input
      type="text"
      id="name"
      placeholder="Your full name"
      required
    >


    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      autocomplete="email"
      required
    >


    <label for="role">
      Account Type
    </label>

    <select
      id="role"
      required
    >
      <option value="client">
        Client
      </option>

      <option value="mentor">
        Mentor
      </option>
    </select>


    <div
      class="role-info"
      id="roleInfo"
    >
      Client accounts are approved automatically.
    </div>


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Create a password"
      minlength="8"
      autocomplete="new-password"
      required
    >


    <label for="confirm">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirm"
      placeholder="Confirm your password"
      minlength="8"
      autocomplete="new-password"
      required
    >


    <button
      type="submit"
      id="registerButton"
    >
      Create Account
    </button>

  </form>


  <div
    id="message"
    class="message"
  ></div>


  <!-- RESEND CONFIRMATION -->

  <div
    id="resendBox"
    class="resend-box"
  >

    <button
      type="button"
      id="resendButton"
      class="resend-button"
    >
      Resend Confirmation Email
    </button>

  </div>


  <div class="links">

    <p>
      Already have an account?
    </p>

    <a href="login.html">
      Sign In
    </a>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

const registerForm =
  document.getElementById(
    "registerForm"
  );

const nameInput =
  document.getElementById(
    "name"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const roleSelect =
  document.getElementById(
    "role"
  );

const roleInfo =
  document.getElementById(
    "roleInfo"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const confirmInput =
  document.getElementById(
    "confirm"
  );

const message =
  document.getElementById(
    "message"
  );

const registerButton =
  document.getElementById(
    "registerButton"
  );

const resendBox =
  document.getElementById(
    "resendBox"
  );

const resendButton =
  document.getElementById(
    "resendButton"
  );


/* ==========================================
   WEBSITE URL
========================================== */

const SITE_URL =
  "https://juniorligman9-dot.github.io/alpha-traders-host/";


/* ==========================================
   SHOW MESSAGE
========================================== */

function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    "message " +
    type;

}


/* ==========================================
   HIDE RESEND BUTTON
========================================== */

function hideResend() {

  resendBox.classList.remove(
    "show"
  );

}


/* ==========================================
   SHOW RESEND BUTTON
========================================== */

function showResend() {

  resendBox.classList.add(
    "show"
  );

}


/* ==========================================
   UPDATE ROLE INFORMATION
========================================== */

roleSelect.addEventListener(
  "change",
  function () {

    if (
      roleSelect.value ===
      "mentor"
    ) {

      roleInfo.textContent =
        "Mentor accounts require approval from an administrator before accessing the mentor dashboard.";

    }

    else {

      roleInfo.textContent =
        "Client accounts are approved automatically.";

    }

  }
);


/* ==========================================
   RESEND CONFIRMATION EMAIL
========================================== */

resendButton.addEventListener(
  "click",
  async function() {

    const email =
      emailInput.value
        .trim();


    if (
      !email
    ) {

      showMessage(
        "Please enter your email address first.",
        "error"
      );

      return;

    }


    if (
      !window.supabaseClient
    ) {

      showMessage(
        "Supabase is not connected. Check supabase-config.js.",
        "error"
      );

      return;

    }


    resendButton.disabled =
      true;

    resendButton.textContent =
      "Sending...";


    try {

      const {
        error
      } =
        await window.supabaseClient
          .auth
          .resend({

            type:
              "signup",

            email:
              email,

            options: {

              emailRedirectTo:
                SITE_URL

            }

          });


      if (
        error
      ) {

        throw error;

      }


      showMessage(
        "Confirmation email sent! Please check your inbox and spam folder.",
        "success"
      );


    }
    catch (
      error
    ) {

      console.error(
        "Resend error:",
        error
      );


      showMessage(
        error.message ||
        "Could not resend the confirmation email.",
        "error"
      );

    }
    finally {

      resendButton.disabled =
        false;

      resendButton.textContent =
        "Resend Confirmation Email";

    }

  }
);


/* ==========================================
   REGISTER USER
========================================== */

registerForm.addEventListener(
  "submit",
  async function (e) {

    e.preventDefault();


    const fullName =
      nameInput.value.trim();

    const email =
      emailInput.value.trim();

    const role =
      roleSelect.value;

    const password =
      passwordInput.value;

    const confirm =
      confirmInput.value;


    hideResend();


    message.textContent =
      "";

    message.className =
      "message";


    /* PASSWORD CHECK */

    if (
      password !== confirm
    ) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;

    }


    /* CHECK SUPABASE */

    if (
      !window.supabaseClient
    ) {

      showMessage(
        "Supabase is not connected. Check supabase-config.js.",
        "error"
      );

      return;

    }


    /* LOADING */

    registerButton.disabled =
      true;

    registerButton.textContent =
      "Creating Account...";


    showMessage(
      "Creating your account...",
      ""
    );


    try {


      /* ======================================
         SUPABASE SIGN UP
      ====================================== */

      const {
        data,
        error
      } =
        await window.supabaseClient
          .auth
          .signUp({

            email:
              email,

            password:
              password,

            options: {

              emailRedirectTo:
                SITE_URL,

              data: {

                full_name:
                  fullName,

                role:
                  role

              }

            }

          });


      if (
        error
      ) {

        /*
          If Supabase explicitly reports that
          the user already exists, show resend.
        */

        const errorText =
          String(
            error.message || ""
          )
          .toLowerCase();


        if (
          errorText.includes(
            "already registered"
          ) ||
          errorText.includes(
            "already exists"
          ) ||
          errorText.includes(
            "user already"
          )
        ) {

          showMessage(
            "This email already has an account. If you have not verified your email yet, resend the confirmation email below.",
            "warning"
          );

          showResend();

          return;

        }


        throw error;

      }


      if (
        !data.user
      ) {

        throw new Error(
          "Account could not be created."
        );

      }


      /*
        IMPORTANT:

        Supabase may intentionally return a
        user object even when the email is
        already registered, to prevent
        email enumeration.

        An empty identities array can indicate
        that no new user was created.
      */

      const identities =
        data.user.identities;


      if (
        Array.isArray(
          identities
        ) &&
        identities.length === 0
      ) {

        showMessage(
          "This email may already have an account. If you have not confirmed your email yet, resend the confirmation email below.",
          "warning"
        );

        showResend();

        return;

      }


      /* ======================================
         SUCCESS MESSAGE
      ====================================== */

      if (
        role ===
        "mentor"
      ) {

        showMessage(
          "Account created! A confirmation email has been sent. After confirming your email, your mentor account will require administrator approval.",
          "success"
        );

      }

      else {

        showMessage(
          "Account created! A confirmation email has been sent. Please check your inbox and spam folder.",
          "success"
        );

      }


      /*
        Keep the email visible so the user
        can resend confirmation if necessary.
      */

      nameInput.value =
        "";

      passwordInput.value =
        "";

      confirmInput.value =
        "";


      showResend();


    }
    catch (
      error
    ) {

      console.error(
        "Registration error:",
        error
      );


      const errorText =
        String(
          error.message || ""
        )
        .toLowerCase();


      /*
        SHOW RESEND FOR POSSIBLE
        EXISTING ACCOUNT ERRORS
      */

      if (
        errorText.includes(
          "already registered"
        ) ||
        errorText.includes(
          "already exists"
        )
      ) {

        showMessage(
          "This email already has an account. If it is not verified, click the button below to resend the confirmation email.",
          "warning"
        );

        showResend();

      }

      else {

        showMessage(
          "Error: " +
          (
            error.message ||
            "Could not create account."
          ),
          "error"
        );

      }

    }
    finally {

      registerButton.disabled =
        false;

      registerButton.textContent =
        "Create Account";

    }

  }
);

</script>

</body>
</html>
