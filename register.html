<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - Alpha Traders Host</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0b0f19;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 430px;
  background: #121827;
  border: 1px solid #20283a;
  border-radius: 16px;
  padding: 35px;
}

.logo {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 10px;
}

.logo span {
  color: #00d084;
}

.subtitle {
  text-align: center;
  color: #929bad;
  margin-bottom: 30px;
}

label {
  display: block;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 18px;
  background: #0b0f19;
  border: 1px solid #30394d;
  border-radius: 8px;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  background: #00d084;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
}

.links {
  text-align: center;
  margin-top: 20px;
}

a {
  color: #00d084;
  text-decoration: none;
}

.message {
  text-align: center;
  margin-top: 15px;
  color: #929bad;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    ALPHA <span>TRADERS HOST</span>
  </div>

  <p class="subtitle">
    Create your hosting account
  </p>

  <form id="registerForm">

    <label>Full Name</label>

    <input
      type="text"
      id="name"
      placeholder="Your name"
      required
    >

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Create a password"
      minlength="8"
      required
    >

    <label>Confirm Password</label>

    <input
      type="password"
      id="confirm"
      placeholder="Confirm password"
      minlength="8"
      required
    >

    <button type="submit">
      Create Account
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="links">
    <p>Already have an account?</p>
    <br>
    <a href="login.html">Sign In</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
document.getElementById("registerForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const fullName = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    const message = document.getElementById("message");

    message.textContent = "";

    if (password !== confirm) {
        message.textContent = "Passwords do not match.";
        return;
    }

    message.textContent = "Creating your account...";

    try {
        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName
                }
            }
        });

        if (error) {
            message.textContent = "Error: " + error.message;
            return;
        }

        if (data.user) {
            message.textContent =
                "Account created successfully! Please check your email to confirm your account.";
        } else {
            message.textContent = "Something went wrong. Please try again.";
        }

    } catch (err) {
        message.textContent = "Connection error: " + err.message;
    }
});
</script>
