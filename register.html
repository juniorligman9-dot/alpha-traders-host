<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Alpha Traders Host</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0b0f19;
  --card: #121827;
  --border: #30394d;
  --text: #ffffff;
  --muted: #929bad;
  --accent: #00d084;
  --danger: #ff6b6b;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 500px;
  background: var(--card);
  border: 1px solid #20283a;
  border-radius: 18px;
  padding: 38px;
}

.logo {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 10px;
}

.logo span {
  color: var(--accent);
}

.subtitle {
  text-align: center;
  color: var(--muted);
  margin-bottom: 30px;
  font-size: 16px;
}

form {
  display: flex;
  flex-direction: column;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 16px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 15px;
  margin-bottom: 20px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus,
select:focus {
  border-color: var(--accent);
}

select {
  cursor: pointer;
}

button {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  color: #07110f;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s ease;
}

button:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.message {
  text-align: center;
  margin-top: 18px;
  color: var(--muted);
  min-height: 24px;
  line-height: 1.5;
}

.message.error {
  color: var(--danger);
}

.message.success {
  color: var(--accent);
}

.links {
  text-align: center;
  margin-top: 24px;
  color: var(--muted);
}

.links a {
  display: inline-block;
  margin-top: 10px;
  color: var(--accent);
  text-decoration: none;
  font-weight: bold;
}

.links a:hover {
  text-decoration: underline;
}

.role-info {
  background: rgba(0, 208, 132, 0.08);
  border: 1px solid rgba(0, 208, 132, 0.25);
  color: var(--muted);
  border-radius: 10px;
  padding: 13px;
  margin-top: -8px;
  margin-bottom: 20px;
  font-size: 14px;
  line-height: 1.5;
}

@media (max-width: 500px) {

  body {
    padding: 15px;
    align-items: flex-start;
  }

  .box {
    margin-top: 20px;
    padding: 30px 22px;
  }

  .logo {
    font-size: 23px;
  }

}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    ALPHA <span>TRADERS HOST</span>
  </div>

  <p class="subtitle">
    Create your account
  </p>


  <form id="registerForm">

    <label for="name">
      Full Name
    </label>

    <input
      type="text"
      id="name"
      placeholder="Your full name"
      required
    >


    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      required
    >


    <label for="role">
      Account Type
    </label>

    <select
      id="role"
      required
    >
      <option value="client">
        Client
      </option>

      <option value="mentor">
        Mentor
      </option>
    </select>


    <div
      class="role-info"
      id="roleInfo"
    >
      Client accounts are approved automatically.
    </div>


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Create a password"
      minlength="8"
      required
    >


    <label for="confirm">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirm"
      placeholder="Confirm your password"
      minlength="8"
      required
    >


    <button
      type="submit"
      id="registerButton"
    >
      Create Account
    </button>

  </form>


  <div
    id="message"
    class="message"
  ></div>


  <div class="links">

    <p>
      Already have an account?
    </p>

    <a href="login.html">
      Sign In
    </a>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

const registerForm =
  document.getElementById(
    "registerForm"
  );

const nameInput =
  document.getElementById(
    "name"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const roleSelect =
  document.getElementById(
    "role"
  );

const roleInfo =
  document.getElementById(
    "roleInfo"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const confirmInput =
  document.getElementById(
    "confirm"
  );

const message =
  document.getElementById(
    "message"
  );

const registerButton =
  document.getElementById(
    "registerButton"
  );


/* ==========================================
   UPDATE ROLE INFORMATION
========================================== */

roleSelect.addEventListener(
  "change",
  function () {

    if (
      roleSelect.value ===
      "mentor"
    ) {

      roleInfo.textContent =
        "Mentor accounts require approval from an administrator before accessing the mentor dashboard.";

    }

    else {

      roleInfo.textContent =
        "Client accounts are approved automatically.";

    }

  }
);


/* ==========================================
   REGISTER USER
========================================== */

registerForm.addEventListener(
  "submit",
  async function (e) {

    e.preventDefault();


    const fullName =
      nameInput.value.trim();

    const email =
      emailInput.value.trim();

    const role =
      roleSelect.value;

    const password =
      passwordInput.value;

    const confirm =
      confirmInput.value;


    message.textContent =
      "";

    message.className =
      "message";


    /* PASSWORD CHECK */

    if (
      password !== confirm
    ) {

      message.textContent =
        "Passwords do not match.";

      message.classList.add(
        "error"
      );

      return;

    }


    /* CHECK SUPABASE */

    if (
      !window.supabaseClient
    ) {

      message.textContent =
        "Supabase is not connected. Check supabase-config.js.";

      message.classList.add(
        "error"
      );

      return;

    }


    /* LOADING */

    registerButton.disabled =
      true;

    registerButton.textContent =
      "Creating Account...";


    message.textContent =
      "Creating your account...";


    try {


      /* ======================================
         SUPABASE SIGN UP
      ====================================== */

      const {
        data,
        error
      } =
        await window.supabaseClient
          .auth
          .signUp({

            email:
              email,

            password:
              password,

            options: {

              data: {

                full_name:
                  fullName,

                role:
                  role

              }

            }

          });


      if (
        error
      ) {

        throw error;

      }


      if (
        !data.user
      ) {

        throw new Error(
          "Account could not be created."
        );

      }


      /* ======================================
         SUCCESS MESSAGE
      ====================================== */

      message.className =
        "message success";


      if (
        role ===
        "mentor"
      ) {

        message.textContent =
          "Mentor account created successfully! Please confirm your email. Your account will require administrator approval.";

      }

      else {

        message.textContent =
          "Client account created successfully! Please confirm your email before signing in.";

      }


      registerForm.reset();


    }
    catch (
      error
    ) {

      console.error(
        "Registration error:",
        error
      );


      message.className =
        "message error";


      message.textContent =
        "Error: " +
        (
          error.message ||
          "Could not create account."
        );

    }
    finally {

      registerButton.disabled =
        false;

      registerButton.textContent =
        "Create Account";

    }

  }
);

</script>

</body>
</html>
