<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Dashboard | Alpha Traders Host</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #111a29;
      --header: #131d2d;
      --card: #2a374a;
      --card-dark: #1b2738;
      --border: #3b4d66;
      --text: #e7e9ee;
      --muted: #b6bfce;
      --accent: #55c5b5;
      --accent-dark: #36a999;
      --danger: #ef6666;
      --warning: #f5b942;
      --success: #55c5b5;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      width: 100%;
      background: var(--header);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--text);
      text-decoration: none;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-button {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .logout-button {
      border-color: var(--danger);
      color: #ffc1c1;
    }

    .logout-button:hover {
      background: rgba(239, 102, 102, 0.08);
      color: var(--danger);
    }

    /* =========================
       MAIN
    ========================== */

    main {
      width: 100%;
    }

    .container {
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      padding: 45px 28px 80px;
    }

    .hero {
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: clamp(38px, 6vw, 58px);
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .hero p {
      color: var(--muted);
      font-size: 19px;
    }

    /* =========================
       STATS
    ========================== */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 35px;
    }

    .stat-card {
      min-height: 150px;
      padding: 26px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-number {
      color: var(--accent);
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 12px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 16px;
    }

    /* =========================
       SECTIONS
    ========================== */

    .section {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px;
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .section-header h2 {
      font-size: 30px;
    }

    .refresh-button {
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--accent);
      border-radius: 14px;
      background: transparent;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    .refresh-button:hover {
      background: rgba(85, 197, 181, 0.08);
    }

    .refresh-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       USER CARDS
    ========================== */

    .user-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .user-card {
      background: var(--card-dark);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
    }

    .user-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 16px;
    }

    .user-name {
      font-size: 21px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .user-email {
      color: var(--muted);
      font-size: 15px;
      overflow-wrap: anywhere;
      margin-top: 5px;
    }

    .badge {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid var(--border);
    }

    .badge.pending {
      color: var(--warning);
      border-color: var(--warning);
    }

    .badge.approved {
      color: var(--success);
      border-color: var(--success);
    }

    .badge.rejected {
      color: var(--danger);
      border-color: var(--danger);
    }

    .badge.client {
      color: #8db4ff;
      border-color: #8db4ff;
    }

    .user-meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    /* =========================
       ACTIONS
    ========================== */

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .approve-button,
    .reject-button {
      min-height: 45px;
      padding: 0 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .approve-button {
      border: none;
      background: var(--accent);
      color: #10201f;
    }

    .approve-button:hover {
      background: var(--accent-dark);
    }

    .reject-button {
      background: transparent;
      border: 1px solid var(--danger);
      color: #ffc1c1;
    }

    .reject-button:hover {
      background: rgba(239, 102, 102, 0.08);
    }

    .approve-button:disabled,
    .reject-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       STATES
    ========================== */

    .empty-state,
    .status-message {
      width: 100%;
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--card-dark);
      border: 1px dashed var(--border);
      border-radius: 18px;
    }

    .empty-state h3 {
      color: var(--text);
      margin-bottom: 8px;
    }

    .error-message {
      color: #ffc1c1;
      border-color: var(--danger);
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 950px) {

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .user-list {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 600px) {

      .nav-container {
        padding: 18px 20px;
        flex-direction: column;
        align-items: stretch;
      }

      .logo {
        text-align: center;
        font-size: 22px;
      }

      .nav-actions {
        width: 100%;
      }

      .nav-button {
        flex: 1;
      }

      .container {
        padding: 32px 18px 60px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .stat-card {
        min-height: 130px;
      }

      .section {
        padding: 20px;
        border-radius: 22px;
      }

      .section-header {
        flex-direction: column;
        align-items: stretch;
      }

      .refresh-button {
        width: 100%;
      }

      .hero h1 {
        font-size: 40px;
      }

      .user-top {
        flex-direction: column;
      }

    }

  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="nav-container">

      <a
        href="index.html"
        class="logo"
      >
        ALPHA <span>TRADERS HOST</span>
      </a>


      <div class="nav-actions">

        <button
          type="button"
          class="nav-button"
          id="refreshTopButton"
        >
          ↻ Refresh
        </button>


        <button
          type="button"
          class="nav-button logout-button"
          id="logoutButton"
        >
          Sign Out
        </button>

      </div>

    </div>

  </header>


  <!-- MAIN -->

  <main>

    <div class="container">

      <!-- HERO -->

      <section class="hero">

        <h1>
          Admin Dashboard
        </h1>

        <p>
          Manage mentor applications and platform users.
        </p>

      </section>


      <!-- STATS -->

      <section class="stats-grid">

        <div class="stat-card">

          <div
            class="stat-number"
            id="totalUsers"
          >
            0
          </div>

          <div class="stat-label">
            Total Users
          </div>

        </div>


        <div class="stat-card">

          <div
            class="stat-number"
            id="totalClients"
          >
            0
          </div>

          <div class="stat-label">
            Clients
          </div>

        </div>


        <div class="stat-card">

          <div
            class="stat-number"
            id="pendingMentors"
          >
            0
          </div>

          <div class="stat-label">
            Pending Mentors
          </div>

        </div>


        <div class="stat-card">

          <div
            class="stat-number"
            id="approvedMentors"
          >
            0
          </div>

          <div class="stat-label">
            Approved Mentors
          </div>

        </div>

      </section>


      <!-- PENDING MENTORS -->

      <section class="section">

        <div class="section-header">

          <h2>
            Pending Mentor Applications
          </h2>

          <button
            type="button"
            class="refresh-button"
            id="refreshButton"
          >
            ↻ Refresh
          </button>

        </div>


        <div
          id="pendingContent"
          class="status-message"
        >
          Loading mentor applications...
        </div>

      </section>


      <!-- APPROVED MENTORS -->

      <section class="section">

        <div class="section-header">

          <h2>
            Approved Mentors
          </h2>

        </div>


        <div
          id="approvedContent"
          class="status-message"
        >
          Loading approved mentors...
        </div>

      </section>


      <!-- CLIENTS -->

      <section class="section">

        <div class="section-header">

          <h2>
            Clients
          </h2>

        </div>


        <div
          id="clientsContent"
          class="status-message"
        >
          Loading clients...
        </div>

      </section>

    </div>

  </main>


  <script>

    /* ========================================
       ELEMENTS
    ======================================== */

    const totalUsers =
      document.getElementById("totalUsers");

    const totalClients =
      document.getElementById("totalClients");

    const pendingMentors =
      document.getElementById("pendingMentors");

    const approvedMentors =
      document.getElementById("approvedMentors");

    const pendingContent =
      document.getElementById("pendingContent");

    const approvedContent =
      document.getElementById("approvedContent");

    const clientsContent =
      document.getElementById("clientsContent");

    const refreshButton =
      document.getElementById("refreshButton");

    const refreshTopButton =
      document.getElementById("refreshTopButton");

    const logoutButton =
      document.getElementById("logoutButton");


    /* ========================================
       GET SUPABASE
    ======================================== */

    function getSupabaseClient() {

      if (
        typeof window.supabaseClient !==
        "undefined"
      ) {
        return window.supabaseClient;
      }

      return null;

    }


    /* ========================================
       ESCAPE HTML
    ======================================== */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ========================================
       FORMAT DATE
    ======================================== */

    function formatDate(date) {

      if (!date) {
        return "Unknown";
      }

      const parsedDate =
        new Date(date);

      if (
        Number.isNaN(
          parsedDate.getTime()
        )
      ) {
        return "Unknown";
      }

      return parsedDate.toLocaleDateString();

    }


    /* ========================================
       SET LOADING
    ======================================== */

    function setLoading() {

      pendingContent.className =
        "status-message";

      pendingContent.textContent =
        "Loading mentor applications...";


      approvedContent.className =
        "status-message";

      approvedContent.textContent =
        "Loading approved mentors...";


      clientsContent.className =
        "status-message";

      clientsContent.textContent =
        "Loading clients...";

    }


    /* ========================================
       SHOW ERROR
    ======================================== */

    function showError(message) {

      const errorHTML =
        `

          <div class="status-message error-message">

            <strong>
              Dashboard Error
            </strong>

            <br><br>

            ${escapeHTML(
              message
            )}

          </div>

        `;


      pendingContent.className =
        "";

      approvedContent.className =
        "";

      clientsContent.className =
        "";


      pendingContent.innerHTML =
        errorHTML;

      approvedContent.innerHTML =
        errorHTML;

      clientsContent.innerHTML =
        errorHTML;

    }


    /* ========================================
       UPDATE STATISTICS
    ======================================== */

    function updateStatistics(users) {

      const clients =
        users.filter(
          function(user) {

            return (
              String(
                user.role || ""
              )
              .toLowerCase() ===
              "client"
            );

          }
        );


      const pending =
        users.filter(
          function(user) {

            return (
              String(
                user.role || ""
              )
              .toLowerCase() ===
              "mentor"
            )
            &&
            (
              String(
                user.approval_status ||
                ""
              )
              .toLowerCase() ===
              "pending"
            );

          }
        );


      const approved =
        users.filter(
          function(user) {

            return (
              String(
                user.role || ""
              )
              .toLowerCase() ===
              "mentor"
            )
            &&
            (
              String(
                user.approval_status ||
                ""
              )
              .toLowerCase() ===
              "approved"
            );

          }
        );


      totalUsers.textContent =
        users.length;

      totalClients.textContent =
        clients.length;

      pendingMentors.textContent =
        pending.length;

      approvedMentors.textContent =
        approved.length;

    }


    /* ========================================
       CREATE MENTOR CARD
    ======================================== */

    function createMentorCard(
      user,
      status
    ) {

      const name =
        escapeHTML(
          user.full_name ||
          "Unnamed Mentor"
        );


      const email =
        escapeHTML(
          user.email ||
          "Email unavailable"
        );


      const createdAt =
        escapeHTML(
          formatDate(
            user.created_at
          )
        );


      const userId =
        String(
          user.id || ""
        );


      let actions =
        "";


      if (
        status === "pending"
      ) {

        actions =
          `

            <div class="actions">

              <button
                type="button"
                class="approve-button"
                onclick="approveMentor('${userId}')"
              >
                ✓ Approve Mentor
              </button>


              <button
                type="button"
                class="reject-button"
                onclick="rejectMentor('${userId}')"
              >
                ✕ Reject
              </button>

            </div>

          `;

      }
      else if (
        status === "approved"
      ) {

        actions =
          `

            <div class="actions">

              <button
                type="button"
                class="reject-button"
                onclick="rejectMentor('${userId}')"
              >
                Remove Approval
              </button>

            </div>

          `;

      }


      return `

        <article class="user-card">

          <div class="user-top">

            <div>

              <div class="user-name">
                ${name}
              </div>


              <div class="user-email">
                ${email}
              </div>

            </div>


            <div class="badge ${escapeHTML(status)}">

              ${escapeHTML(
                status.toUpperCase()
              )}

            </div>

          </div>


          <div class="user-meta">

            Applied:
            ${createdAt}

          </div>


          ${actions}

        </article>

      `;

    }


    /* ========================================
       RENDER PENDING MENTORS
    ======================================== */

    function renderPendingMentors(users) {

      const mentors =
        users.filter(
          function(user) {

            return (
              String(
                user.role || ""
              )
              .toLowerCase() ===
              "mentor"
            )
            &&
            (
              String(
                user.approval_status ||
                ""
              )
              .toLowerCase() ===
              "pending"
            );

          }
        );


      if (
        mentors.length === 0
      ) {

        pendingContent.className =
          "empty-state";


        pendingContent.innerHTML =
          `
            <h3>
              No pending applications
            </h3>

            <p>
              There are currently no mentors
              waiting for approval.
            </p>
          `;

        return;

      }


      let html =
        '<div class="user-list">';


      mentors.forEach(
        function(user) {

          html +=
            createMentorCard(
              user,
              "pending"
            );

        }
      );


      html +=
        "</div>";


      pendingContent.className =
        "";


      pendingContent.innerHTML =
        html;

    }


    /* ========================================
       RENDER APPROVED MENTORS
    ======================================== */

    function renderApprovedMentors(users) {

      const mentors =
        users.filter(
          function(user) {

            return (
              String(
                user.role || ""
              )
              .toLowerCase() ===
              "mentor"
            )
            &&
            (
              String(
                user.approval_status ||
                ""
              )
              .toLowerCase() ===
              "approved"
            );

          }
        );


      if (
        mentors.length === 0
      ) {

        approvedContent.className =
          "empty-state";


        approvedContent.innerHTML =
          `
            <h3>
              No approved mentors yet
            </h3>

            <p>
              Approved mentor accounts
              will appear here.
            </p>
          `;

        return;

      }


      let html =
        '<div class="user-list">';


      mentors.forEach(
        function(user) {

          html +=
            createMentorCard(
              user,
              "approved"
            );

        }
      );


      html +=
        "</div>";


      approvedContent.className =
        "";


      approvedContent.innerHTML =
        html;

    }


    /* ========================================
       RENDER CLIENTS
    ======================================== */

    function renderClients(users) {

      const clients =
        users.filter(
          function(user) {

            return (
              String(
                user.role || ""
              )
              .toLowerCase() ===
              "client"
            );

          }
        );


      if (
        clients.length === 0
      ) {

        clientsContent.className =
          "empty-state";


        clientsContent.innerHTML =
          `
            <h3>
              No clients yet
            </h3>
          `;

        return;

      }


      let html =
        '<div class="user-list">';


      clients.forEach(
        function(user) {

          const name =
            escapeHTML(
              user.full_name ||
              "Unnamed User"
            );


          const email =
            escapeHTML(
              user.email ||
              "Email unavailable"
            );


          html +=
            `

              <article class="user-card">

                <div class="user-top">

                  <div>

                    <div class="user-name">
                      ${name}
                    </div>


                    <div class="user-email">
                      ${email}
                    </div>

                  </div>


                  <div class="badge client">
                    CLIENT
                  </div>

                </div>

              </article>

            `;

        }
      );


      html +=
        "</div>";


      clientsContent.className =
        "";


      clientsContent.innerHTML =
        html;

    }


    /* ========================================
       APPROVE MENTOR
    ======================================== */

    async function approveMentor(userId) {

      if (!userId) {

        alert(
          "Mentor ID is missing."
        );

        return;

      }


      const confirmed =
        confirm(
          "Are you sure you want to approve this mentor?"
        );


      if (!confirmed) {
        return;
      }


      const supabaseClient =
        getSupabaseClient();


      if (!supabaseClient) {

        alert(
          "Supabase is not connected."
        );

        return;

      }


      try {

        const {
          error
        } =
          await supabaseClient
            .from("profiles")
            .update({
              approval_status:
                "approved"
            })
            .eq(
              "id",
              userId
            )
            .eq(
              "role",
              "mentor"
            );


        if (error) {
          throw error;
        }


        alert(
          "Mentor approved successfully!"
        );


        await loadDashboard();


      }
      catch (error) {

        console.error(
          "Approve mentor error:",
          error
        );


        alert(
          "Could not approve mentor: " +
          (
            error.message ||
            "Unknown error"
          )
        );

      }

    }


    /* ========================================
       REJECT MENTOR
    ======================================== */

    async function rejectMentor(userId) {

      if (!userId) {

        alert(
          "Mentor ID is missing."
        );

        return;

      }


      const confirmed =
        confirm(
          "Are you sure you want to reject this mentor?"
        );


      if (!confirmed) {
        return;
      }


      const supabaseClient =
        getSupabaseClient();


      if (!supabaseClient) {

        alert(
          "Supabase is not connected."
        );

        return;

      }


      try {

        const {
          error
        } =
          await supabaseClient
            .from("profiles")
            .update({
              approval_status:
                "rejected"
            })
            .eq(
              "id",
              userId
            )
            .eq(
              "role",
              "mentor"
            );


        if (error) {
          throw error;
        }


        alert(
          "Mentor application rejected."
        );


        await loadDashboard();


      }
      catch (error) {

        console.error(
          "Reject mentor error:",
          error
        );


        alert(
          "Could not reject mentor: " +
          (
            error.message ||
            "Unknown error"
          )
        );

      }

    }


    /* ========================================
       LOAD DASHBOARD
    ======================================== */

    async function loadDashboard() {

      const supabaseClient =
        getSupabaseClient();


      if (!supabaseClient) {

        showError(
          "Supabase is not connected."
        );

        return;

      }


      setLoading();


      refreshButton.disabled =
        true;

      refreshTopButton.disabled =
        true;


      try {

        /* =========================
           GET LOGGED-IN USER
        ========================== */

        const {
          data: authData,
          error: authError
        } =
          await supabaseClient
            .auth
            .getUser();


        if (authError) {
          throw authError;
        }


        const user =
          authData?.user;


        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        /* =========================
           CHECK ADMIN ROLE
        ========================== */

        const {
          data: adminProfile,
          error: adminError
        } =
          await supabaseClient
            .from("profiles")
            .select(
              "id, role, approval_status"
            )
            .eq(
              "id",
              user.id
            )
            .single();


        if (adminError) {
          throw adminError;
        }


        if (
          !adminProfile ||
          String(
            adminProfile.role || ""
          )
          .toLowerCase()
          .trim() !== "admin"
        ) {

          alert(
            "Access denied. Admin access is required."
          );


          await supabaseClient
            .auth
            .signOut();


          window.location.href =
            "login.html";

          return;

        }


        /* =========================
           LOAD PROFILES
        ========================== */

        const {
          data: profiles,
          error: profilesError
        } =
          await supabaseClient
            .from("profiles")
            .select(
              `
                id,
                full_name,
                email,
                role,
                approval_status,
                created_at
              `
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (profilesError) {
          throw profilesError;
        }


        const users =
          Array.isArray(profiles)
            ? profiles
            : [];


        updateStatistics(
          users
        );


        renderPendingMentors(
          users
        );


        renderApprovedMentors(
          users
        );


        renderClients(
          users
        );


      }
      catch (error) {

        console.error(
          "Admin dashboard error:",
          error
        );


        showError(
          error.message ||
          "Could not load the admin dashboard."
        );

      }
      finally {

        refreshButton.disabled =
          false;

        refreshTopButton.disabled =
          false;

      }

    }


    /* ========================================
       REFRESH BUTTONS
    ======================================== */

    refreshButton.addEventListener(
      "click",
      function() {

        loadDashboard();

      }
    );


    refreshTopButton.addEventListener(
      "click",
      function() {

        loadDashboard();

      }
    );


    /* ========================================
       LOGOUT
    ======================================== */

    logoutButton.addEventListener(
      "click",
      async function() {

        const supabaseClient =
          getSupabaseClient();


        if (supabaseClient) {

          await supabaseClient
            .auth
            .signOut();

        }


        window.location.href =
          "login.html";

      }
    );


    /* ========================================
       INITIALIZE
    ======================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadDashboard();

      }
    );

  </script>

</body>
</html>
