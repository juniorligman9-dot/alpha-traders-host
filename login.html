<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Alpha Traders Host</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0b0f19;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 420px;
  background: #121827;
  border: 1px solid #20283a;
  border-radius: 16px;
  padding: 35px;
}

.logo {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 10px;
}

.logo span {
  color: #00d084;
}

.subtitle {
  text-align: center;
  color: #929bad;
  margin-bottom: 30px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #cbd2df;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 20px;
  background: #0b0f19;
  border: 1px solid #30394d;
  border-radius: 8px;
  color: white;
  font-size: 16px;
}

input:focus {
  outline: none;
  border-color: #00d084;
}

button {
  width: 100%;
  padding: 14px;
  background: #00d084;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.links {
  text-align: center;
  margin-top: 20px;
}

.links a {
  color: #00d084;
  text-decoration: none;
}

.message {
  margin-top: 15px;
  text-align: center;
  color: #ffb4b4;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    ALPHA <span>TRADERS HOST</span>
  </div>

  <p class="subtitle">
    Sign in to your hosting dashboard
  </p>

  <form id="loginForm">

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Your password"
      required
    >

    <button type="submit">
      Sign In
    </button>

  </form>

  <div class="links">
    <p>Don't have an account?</p>
    <br>
    <a href="register.html">Create Account</a>
  </div>

  <div id="message" class="message"></div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e) {

  e.preventDefault();

  document.getElementById("message").textContent =
    "The secure login backend will be connected next.";

});

</script>

</body>
</html>
