<script>

  /* ==========================================
     ELEMENTS
  ========================================== */

  const loginForm =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const message =
    document.getElementById("message");

  const loginButton =
    document.getElementById("loginButton");

  const resendButton =
    document.getElementById("resendButton");

  const selectedRoleElement =
    document.getElementById("selectedRole");


  /* ==========================================
     GET SELECTED ROLE FROM URL
  ========================================== */

  const urlParams =
    new URLSearchParams(
      window.location.search
    );


  const requestedRole =
    String(
      urlParams.get("role") || ""
    )
    .toLowerCase()
    .trim();


  /* ==========================================
     DISPLAY LOGIN TYPE
  ========================================== */

  if (requestedRole === "admin") {

    selectedRoleElement.textContent =
      "👑 Admin Login";

  }

  else if (requestedRole === "mentor") {

    selectedRoleElement.textContent =
      "🎓 Mentor Login";

  }

  else if (requestedRole === "client") {

    selectedRoleElement.textContent =
      "👤 Client Login";

  }

  else {

    selectedRoleElement.textContent =
      "Account Login";

  }


  /* ==========================================
     GET SUPABASE CLIENT
  ========================================== */

  function getSupabaseClient() {

    if (
      typeof window.supabaseClient !==
      "undefined"
    ) {

      return window.supabaseClient;

    }

    return null;

  }


  /* ==========================================
     RESET LOGIN BUTTON
  ========================================== */

  function resetLoginButton() {

    loginButton.disabled =
      false;

    loginButton.textContent =
      "Sign In →";

  }


  /* ==========================================
     SHOW ERROR
  ========================================== */

  function showError(text) {

    message.textContent =
      text;

    message.className =
      "message error";

    resetLoginButton();

  }


  /* ==========================================
     SHOW SUCCESS
  ========================================== */

  function showSuccess(text) {

    message.textContent =
      text;

    message.className =
      "message success";

  }


  /* ==========================================
     REDIRECT AFTER LOGIN
  ========================================== */

  function redirectToDashboard(role) {

    if (role === "admin") {

      window.location.href =
        "admin-dashboard.html";

      return;

    }


    if (role === "mentor") {

      window.location.href =
        "mentor-dashboard.html";

      return;

    }


    if (role === "client") {

      window.location.href =
        "client-dashboard.html";

      return;

    }


    window.location.href =
      "index.html";

  }


  /* ==========================================
     RESEND CONFIRMATION EMAIL
  ========================================== */

  resendButton.addEventListener(
    "click",
    async function() {


      const supabaseClient =
        getSupabaseClient();


      if (!supabaseClient) {

        showError(
          "Supabase is not connected. Please check supabase-config.js"
        );

        return;

      }


      const email =
        emailInput.value.trim();


      if (!email) {

        showError(
          "Please enter your email address first."
        );

        emailInput.focus();

        return;

      }


      message.textContent =
        "";

      message.className =
        "message";


      resendButton.disabled =
        true;

      resendButton.textContent =
        "Sending Email...";


      try {


        const {
          error
        } =
          await supabaseClient
            .auth
            .resend({

              type:
                "signup",

              email:
                email,

              options: {

                emailRedirectTo:
                  "https://juniorligman9-dot.github.io/alpha-traders-host/login.html"

              }

            });


        if (error) {

          throw error;

        }


        showSuccess(
          "Confirmation email sent! Please check your inbox and spam folder."
        );


      }

      catch (error) {


        console.error(
          "Resend email error:",
          error
        );


        showError(
          error.message ||
          "Could not send the confirmation email. Please try again later."
        );


      }

      finally {


        resendButton.disabled =
          false;

        resendButton.textContent =
          "Resend Confirmation Email";

      }


    }
  );


  /* ==========================================
     LOGIN FORM
  ========================================== */

  loginForm.addEventListener(
    "submit",
    async function(event) {


      event.preventDefault();


      const supabaseClient =
        getSupabaseClient();


      /* ----------------------------------------
         CHECK SUPABASE
      ---------------------------------------- */

      if (!supabaseClient) {

        showError(
          "Supabase is not connected. Please check supabase-config.js"
        );

        return;

      }


      /* ----------------------------------------
         GET VALUES
      ---------------------------------------- */

      const email =
        emailInput.value.trim();


      const password =
        passwordInput.value;


      /* ----------------------------------------
         CLEAR MESSAGE
      ---------------------------------------- */

      message.textContent =
        "";

      message.className =
        "message";


      loginButton.disabled =
        true;

      loginButton.textContent =
        "Signing In...";


      try {


        /* ======================================
           SIGN IN USER
        ====================================== */

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email:
                email,

              password:
                password

            });


        if (error) {

          showError(
            "Login failed: " +
            error.message
          );

          return;

        }


        if (
          !data ||
          !data.user
        ) {

          showError(
            "Unable to sign in. Please try again."
          );

          return;

        }


        /* ======================================
           CHECK EMAIL VERIFICATION
        ====================================== */

        if (
          !data.user.email_confirmed_at
        ) {

          await supabaseClient
            .auth
            .signOut();


          showError(
            "Your email address has not been confirmed yet. Please check your inbox and spam folder, or click 'Resend Confirmation Email' below."
          );


          resendButton.focus();


          return;

        }


        /* ======================================
           GET USER PROFILE
        ====================================== */

        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select(
              `
                id,
                full_name,
                email,
                role,
                approval_status
              `
            )
            .eq(
              "id",
              data.user.id
            )
            .single();


        if (
          profileError ||
          !profile
        ) {


          console.error(
            "Profile error:",
            profileError
          );


          await supabaseClient
            .auth
            .signOut();


          showError(
            "Your account profile could not be found. Please contact support."
          );


          return;

        }


        /* ======================================
           NORMALIZE ROLE
        ====================================== */

        const role =
          String(
            profile.role || ""
          )
          .toLowerCase()
          .trim();


        const approvalStatus =
          String(
            profile.approval_status || ""
          )
          .toLowerCase()
          .trim();


        /* ======================================
           CHECK WRONG LOGIN TYPE
        ====================================== */

        if (
          requestedRole &&
          requestedRole !== role
        ) {

          await supabaseClient
            .auth
            .signOut();


          showError(
            "This account is registered as a " +
            role +
            ". Please choose the correct login type."
          );


          return;

        }


        /* ======================================
           ADMIN LOGIN
        ====================================== */

        if (role === "admin") {


          showSuccess(
            "Admin login successful! Redirecting..."
          );


          setTimeout(
            function() {

              redirectToDashboard(
                "admin"
              );

            },
            700
          );


          return;

        }


        /* ======================================
           CLIENT LOGIN
        ====================================== */

        if (role === "client") {


          if (
            approvalStatus === "rejected"
          ) {

            await supabaseClient
              .auth
              .signOut();


            showError(
              "Your account has been rejected. Please contact support."
            );


            return;

          }


          if (
            approvalStatus === "pending"
          ) {

            await supabaseClient
              .auth
              .signOut();


            showError(
              "Your client account is waiting for approval."
            );


            return;

          }


          if (
            approvalStatus !== "approved"
          ) {

            await supabaseClient
              .auth
              .signOut();


            showError(
              "Your client account is not approved yet."
            );


            return;

          }


          showSuccess(
            "Login successful! Redirecting..."
          );


          setTimeout(
            function() {

              redirectToDashboard(
                "client"
              );

            },
            700
          );


          return;

        }


        /* ======================================
           MENTOR PENDING
        ====================================== */

        if (
          role === "mentor" &&
          approvalStatus === "pending"
        ) {

          await supabaseClient
            .auth
            .signOut();


          showError(
            "Your mentor account is waiting for admin approval."
          );


          return;

        }


        /* ======================================
           MENTOR REJECTED
        ====================================== */

        if (
          role === "mentor" &&
          approvalStatus === "rejected"
        ) {

          await supabaseClient
            .auth
            .signOut();


          showError(
            "Your mentor application has been rejected. Please contact support."
          );


          return;

        }


        /* ======================================
           MENTOR APPROVED
        ====================================== */

        if (
          role === "mentor" &&
          approvalStatus === "approved"
        ) {


          showSuccess(
            "Login successful! Redirecting to mentor dashboard..."
          );


          setTimeout(
            function() {

              redirectToDashboard(
                "mentor"
              );

            },
            700
          );


          return;

        }


        /* ======================================
           UNKNOWN ROLE OR STATUS
        ====================================== */

        await supabaseClient
          .auth
          .signOut();


        showError(
          "Your account is not configured correctly. Please contact support."
        );


      }

      catch (error) {


        console.error(
          "Login error:",
          error
        );


        showError(
          "Connection error: " +
          (
            error.message ||
            "Please try again."
          )
        );


      }


    }
  );


</script>
