<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | Alpha Traders Host</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0d1422;
      color: #f4f4f4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 600px;
      background: #171f30;
      border: 1px solid #2c3850;
      border-radius: 25px;
      padding: 45px 35px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .logo span {
      color: #20c997;
    }

    .subtitle {
      text-align: center;
      color: #aeb7c7;
      font-size: 18px;
      margin-bottom: 40px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 20px;
      margin-bottom: 10px;
      color: #f1f1f1;
    }

    input {
      width: 100%;
      padding: 18px;
      margin-bottom: 25px;
      border-radius: 15px;
      border: 2px solid #34415a;
      background: #0d1422;
      color: white;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #20c997;
    }

    button {
      width: 100%;
      padding: 18px;
      background: #20c997;
      color: #07110f;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      margin-top: 20px;
      text-align: center;
      color: #bfc7d5;
      font-size: 17px;
      min-height: 24px;
      line-height: 1.5;
    }

    .message.error {
      color: #ff8b8b;
    }

    .message.success {
      color: #20c997;
    }

    .message.warning {
      color: #f5c56b;
    }

    .links {
      text-align: center;
      margin-top: 25px;
      color: #e5e5e5;
      font-size: 18px;
    }

    .links a {
      display: inline-block;
      margin-top: 12px;
      color: #20c997;
      text-decoration: none;
      font-size: 20px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {

      .login-box {
        padding: 40px 25px;
      }

      .logo {
        font-size: 28px;
      }

      label {
        font-size: 18px;
      }

      input {
        font-size: 16px;
      }

    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      ALPHA <span>TRADERS HOST</span>
    </div>

    <p class="subtitle">
      Sign in to your account
    </p>


    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
        autocomplete="email"
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Your password"
        required
        autocomplete="current-password"
      >


      <button
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>


    <div class="links">

      <p>
        Don't have an account?
      </p>

      <a href="register.html">
        Create Account
      </a>

    </div>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- YOUR SUPABASE CONFIGURATION -->
  <script src="supabase-config.js"></script>


  <script>

    /*
    ==========================================
    ELEMENTS
    ==========================================
    */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");


    /*
    ==========================================
    SHOW MESSAGE
    ==========================================
    */

    function showMessage(
      text,
      type = ""
    ) {

      message.textContent =
        text;

      message.className =
        "message " + type;

    }


    /*
    ==========================================
    SET LOGIN BUTTON
    ==========================================
    */

    function setLoading(
      isLoading,
      text = "Sign In"
    ) {

      loginButton.disabled =
        isLoading;

      loginButton.textContent =
        text;

    }


    /*
    ==========================================
    GET USER PROFILE

    Returns:

    {
      role,
      approval_status
    }
    ==========================================
    */

    async function getUserProfile(
      userId
    ) {

      const {
        data,
        error
      } =
        await window.supabaseClient
          .from("profiles")
          .select(`
            role,
            approval_status
          `)
          .eq(
            "id",
            userId
          )
          .single();


      if (error) {

        throw new Error(
          "Could not load your account profile: " +
          error.message
        );

      }


      if (!data) {

        throw new Error(
          "No profile was found for this account."
        );

      }


      return data;

    }


    /*
    ==========================================
    REDIRECT OR BLOCK USER

    Client:
      approved → client dashboard

    Mentor:
      approved → mentor dashboard
      pending  → blocked
      rejected → blocked
    ==========================================
    */

    async function handleUserAccess(
      user
    ) {

      showMessage(
        "Checking your account..."
      );


      const profile =
        await getUserProfile(
          user.id
        );


      const role =
        String(
          profile.role || ""
        )
        .toLowerCase();


      const approvalStatus =
        String(
          profile.approval_status ||
          ""
        )
        .toLowerCase();


      /*
      ======================================
      CLIENT ACCESS
      ======================================
      */

      if (role === "client") {

        /*
        Clients are normally approved
        automatically.
        */

        if (
          approvalStatus === "approved"
        ) {

          showMessage(
            "Login successful! Redirecting...",
            "success"
          );


          window.location.href =
            "client-dashboard.html";

          return;

        }


        /*
        Safety fallback
        */

        if (
          approvalStatus === "pending"
        ) {

          showMessage(
            "Your client account is still awaiting approval.",
            "warning"
          );

          return;

        }


        if (
          approvalStatus === "rejected"
        ) {

          showMessage(
            "Your account was not approved. Please contact support.",
            "error"
          );

          return;

        }


        showMessage(
          "Your account approval status is invalid. Please contact support.",
          "error"
        );

        return;

      }


      /*
      ======================================
      MENTOR ACCESS
      ======================================
      */

      if (role === "mentor") {

        /*
        APPROVED
        */

        if (
          approvalStatus === "approved"
        ) {

          showMessage(
            "Mentor login successful! Redirecting...",
            "success"
          );


          window.location.href =
            "dashboard.html";

          return;

        }


        /*
        PENDING
        */

        if (
          approvalStatus === "pending"
        ) {

          showMessage(
            "Your mentor application is awaiting administrator approval.",
            "warning"
          );

          return;

        }


        /*
        REJECTED
        */

        if (
          approvalStatus === "rejected"
        ) {

          showMessage(
            "Your mentor application was not approved. Please contact support for more information.",
            "error"
          );

          return;

        }


        showMessage(
          "Your mentor account has an invalid approval status.",
          "error"
        );

        return;

      }


      /*
      ======================================
      INVALID ROLE
      ======================================
      */

      showMessage(
        "Your account has an invalid role. Please contact support.",
        "error"
      );

    }


    /*
    ==========================================
    LOGIN FORM
    ==========================================
    */

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const email =
          emailInput.value
            .trim();


        const password =
          passwordInput.value;


        showMessage(
          ""
        );


        /*
        ======================================
        CHECK SUPABASE
        ======================================
        */

        if (
          typeof window.supabaseClient ===
          "undefined"
        ) {

          showMessage(
            "Supabase is not connected. Please check supabase-config.js.",
            "error"
          );

          return;

        }


        setLoading(
          true,
          "Signing In..."
        );


        try {

          /*
          ======================================
          SIGN IN
          ======================================
          */

          const {
            data,
            error
          } =
            await window.supabaseClient
              .auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });


          if (error) {

            throw error;

          }


          const user =
            data?.user;


          if (!user) {

            throw new Error(
              "Unable to sign in. Please try again."
            );

          }


          /*
          ======================================
          CHECK ROLE + APPROVAL
          ======================================
          */

          await handleUserAccess(
            user
          );


        }
        catch (error) {

          console.error(
            "Login error:",
            error
          );


          showMessage(
            error.message ||
            "Unable to sign in. Please try again.",
            "error"
          );

        }
        finally {

          setLoading(
            false,
            "Sign In"
          );

        }

      }
    );


    /*
    ==========================================
    CHECK EXISTING SESSION

    If the user is already logged in,
    automatically check their role and
    send approved users to the correct
    dashboard.
    ==========================================
    */

    async function checkExistingSession() {

      try {

        if (
          typeof window.supabaseClient ===
          "undefined"
        ) {

          return;

        }


        const {
          data,
          error
        } =
          await window.supabaseClient
            .auth
            .getUser();


        if (error) {

          return;

        }


        const user =
          data?.user;


        if (!user) {

          return;

        }


        setLoading(
          true,
          "Checking..."
        );


        await handleUserAccess(
          user
        );


      }
      catch (error) {

        console.error(
          "Session check error:",
          error
        );

      }
      finally {

        setLoading(
          false,
          "Sign In"
        );

      }

    }


    /*
    ==========================================
    PAGE LOAD
    ==========================================
    */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        checkExistingSession();

      }
    );

  </script>

</body>
</html>
