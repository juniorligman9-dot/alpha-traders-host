<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dashboard | Alpha Traders Host</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #101827;
      --bg-secondary: #182233;
      --card: #222d40;
      --card-dark: #172132;
      --border: #34445c;
      --text: #e8ebf0;
      --muted: #b5bdcb;
      --accent: #43c5ad;
      --accent-dark: #2fae98;
      --danger: #ef6464;
      --blue: #5b8fd1;
      --warning: #e8b65d;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #121b2b;
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      min-height: 120px;
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--accent);
    }

    nav {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      padding: 16px 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      font-size: 17px;
      transition: 0.2s;
    }

    nav a:hover,
    nav a.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* MAIN */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 55px 30px 80px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 25px;
      margin-bottom: 35px;
    }

    h1 {
      font-size: clamp(36px, 5vw, 58px);
      margin-bottom: 15px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 20px;
      line-height: 1.6;
    }

    .create-button {
      background: var(--accent);
      color: #102019;
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .create-button:hover {
      background: var(--accent-dark);
    }

    /* STATUS */

    .status-box {
      display: none;
      padding: 18px 20px;
      border-radius: 14px;
      margin-bottom: 25px;
      font-size: 16px;
      line-height: 1.5;
    }

    .status-box.info {
      display: block;
      background: rgba(91, 143, 209, 0.12);
      border: 1px solid var(--blue);
      color: #c7dcff;
    }

    .status-box.success {
      display: block;
      background: rgba(67, 197, 173, 0.12);
      border: 1px solid var(--accent);
      color: #bff4e9;
    }

    .status-box.error {
      display: block;
      background: rgba(239, 100, 100, 0.1);
      border: 1px solid var(--danger);
      color: #ffd1d1;
    }

    /* STATS */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 35px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 25px;
    }

    .stat-number {
      font-size: 38px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 16px;
    }

    /* SECTION */

    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 35px;
    }

    .section-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-top h2 {
      font-size: 30px;
    }

    .refresh-button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .refresh-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* EA GRID */

    .ea-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 22px;
    }

    .ea-card {
      background: var(--card-dark);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 25px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .ea-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .ea-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 18px;
    }

    .ea-name {
      font-size: 25px;
      font-weight: 800;
      word-break: break-word;
    }

    .platform-badge {
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 7px 12px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }

    .ea-description {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 20px;
      min-height: 50px;
    }

    .ea-details {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 18px;
      margin-bottom: 22px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
      font-size: 14px;
    }

    .detail-label {
      color: #8994a6;
    }

    .detail-value {
      color: var(--text);
      text-align: right;
      font-weight: 600;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
      background: rgba(67, 197, 173, 0.12);
      color: var(--accent);
      border: 1px solid rgba(67, 197, 173, 0.4);
    }

    .ea-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .action-button {
      border: none;
      padding: 14px 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .edit-button {
      background: var(--blue);
      color: white;
    }

    .edit-button:hover {
      opacity: 0.9;
    }

    .delete-button {
      background: transparent;
      color: #ff9b9b;
      border: 1px solid var(--danger);
    }

    .delete-button:hover {
      background: rgba(239, 100, 100, 0.12);
    }

    /* EMPTY */

    .empty-state {
      text-align: center;
      padding: 70px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 20px;
    }

    .empty-state h3 {
      color: var(--text);
      font-size: 25px;
      margin-bottom: 12px;
    }

    .empty-state p {
      margin-bottom: 25px;
      line-height: 1.6;
    }

    /* LOADING */

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 18px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(255,255,255,0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .navbar {
        min-height: auto;
        padding: 25px 28px;
      }

      .logo {
        font-size: 22px;
      }

      nav a {
        padding: 13px 17px;
        font-size: 15px;
      }

      main {
        padding: 45px 26px 60px;
      }

      .page-header {
        flex-direction: column;
      }

      .create-button {
        width: 100%;
        text-align: center;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .section-card {
        padding: 25px 20px;
      }

      .section-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .refresh-button {
        width: 100%;
      }

      .ea-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <header>
    <div class="navbar">

      <div class="logo">
        ALPHA <span>TRADERS HOST</span>
      </div>

      <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html" class="active">Dashboard</a>
      </nav>

    </div>
  </header>


  <!-- MAIN CONTENT -->
  <main>

    <div class="page-header">

      <div>
        <h1>Dashboard</h1>
        <p class="subtitle">
          Manage your Expert Advisors and view your saved EA configurations.
        </p>
      </div>

      <a href="create-ea.html" class="create-button">
        + Create New EA
      </a>

    </div>


    <!-- MESSAGE -->
    <div id="statusMessage" class="status-box"></div>


    <!-- STATS -->
    <div class="stats-grid">

      <div class="stat-card">
        <div class="stat-number" id="totalEAs">0</div>
        <div class="stat-label">Total EAs</div>
      </div>

      <div class="stat-card">
        <div class="stat-number" id="mt4Count">0</div>
        <div class="stat-label">MT4 EAs</div>
      </div>

      <div class="stat-card">
        <div class="stat-number" id="mt5Count">0</div>
        <div class="stat-label">MT5 EAs</div>
      </div>

    </div>


    <!-- SAVED EAS -->
    <section class="section-card">

      <div class="section-top">
        <h2>My Saved EAs</h2>

        <button
          class="refresh-button"
          id="refreshButton"
          type="button"
        >
          ↻ Refresh
        </button>
      </div>


      <div id="eaContainer">

        <div class="loading">
          <div class="spinner"></div>
          Loading your saved EAs...
        </div>

      </div>

    </section>

  </main>


  <script>

    /*
    ==================================================
    DASHBOARD FOR EXACT ea_robots TABLE

    Columns:

    id           uuid
    mentor_id    uuid
    name         text
    description  text
    platform     text
    strategy     text
    risk_level   text
    version      text
    status       text
    created_at   timestamptz
    updated_at   timestamptz
    features     jsonb
    ==================================================
    */


    const supabaseClient = window.supabaseClient;

    const eaContainer = document.getElementById("eaContainer");
    const statusMessage = document.getElementById("statusMessage");

    const totalEAsElement = document.getElementById("totalEAs");
    const mt4CountElement = document.getElementById("mt4Count");
    const mt5CountElement = document.getElementById("mt5Count");

    const refreshButton = document.getElementById("refreshButton");


    /*
    ==================================================
    SHOW MESSAGE
    ==================================================
    */

    function showMessage(message, type = "info") {

      statusMessage.textContent = message;

      statusMessage.className = "status-box " + type;

      if (type === "success") {

        setTimeout(() => {

          statusMessage.className = "status-box";
          statusMessage.textContent = "";

        }, 4000);

      }

    }


    /*
    ==================================================
    ESCAPE HTML
    ==================================================
    */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
    ==================================================
    FORMAT DATE
    ==================================================
    */

    function formatDate(dateValue) {

      if (!dateValue) {
        return "—";
      }

      try {

        const date = new Date(dateValue);

        return date.toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric"
        });

      } catch (error) {

        return "—";

      }

    }


    /*
    ==================================================
    UPDATE STATISTICS
    ==================================================
    */

    function updateStats(eas) {

      const total = eas.length;

      const mt4 = eas.filter(function(ea) {
        return String(ea.platform || "").toUpperCase() === "MT4";
      }).length;

      const mt5 = eas.filter(function(ea) {
        return String(ea.platform || "").toUpperCase() === "MT5";
      }).length;


      totalEAsElement.textContent = total;
      mt4CountElement.textContent = mt4;
      mt5CountElement.textContent = mt5;

    }


    /*
    ==================================================
    RENDER EAS
    ==================================================
    */

    function renderEAs(eas) {

      updateStats(eas);


      if (!eas || eas.length === 0) {

        eaContainer.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">🤖</div>

            <h3>No EAs yet</h3>

            <p>
              You have not created any Expert Advisors yet.
              Create your first EA to get started.
            </p>

            <a
              href="create-ea.html"
              class="create-button"
            >
              + Create Your First EA
            </a>

          </div>

        `;

        return;

      }


      let html = `<div class="ea-grid">`;


      eas.forEach(function(ea) {

        const id = escapeHTML(ea.id);
        const name = escapeHTML(ea.name || "Untitled EA");

        const description = escapeHTML(
          ea.description || "No description provided."
        );

        const platform = escapeHTML(
          ea.platform || "MT5"
        );

        const strategy = escapeHTML(
          ea.strategy || "—"
        );

        const riskLevel = escapeHTML(
          ea.risk_level || "—"
        );

        const version = escapeHTML(
          ea.version || "1.0"
        );

        const status = escapeHTML(
          ea.status || "draft"
        );

        const createdDate = formatDate(ea.created_at);


        html += `

          <article class="ea-card">

            <div class="ea-card-top">

              <h3 class="ea-name">
                ${name}
              </h3>

              <span class="platform-badge">
                ${platform}
              </span>

            </div>


            <p class="ea-description">
              ${description}
            </p>


            <div class="ea-details">

              <div class="detail-row">
                <span class="detail-label">Strategy</span>
                <span class="detail-value">${strategy}</span>
              </div>


              <div class="detail-row">
                <span class="detail-label">Risk Level</span>
                <span class="detail-value">${riskLevel}</span>
              </div>


              <div class="detail-row">
                <span class="detail-label">Version</span>
                <span class="detail-value">${version}</span>
              </div>


              <div class="detail-row">
                <span class="detail-label">Status</span>

                <span class="status-badge">
                  ${status}
                </span>

              </div>


              <div class="detail-row">
                <span class="detail-label">Created</span>
                <span class="detail-value">${createdDate}</span>
              </div>

            </div>


            <div class="ea-actions">

              <button
                type="button"
                class="action-button edit-button"
                onclick="editEA('${id}')"
              >
                ✏️ Edit EA
              </button>


              <button
                type="button"
                class="action-button delete-button"
                onclick="deleteEA('${id}', '${name.replace(/'/g, "\\'")}')"
              >
                🗑 Delete
              </button>

            </div>

          </article>

        `;

      });


      html += `</div>`;

      eaContainer.innerHTML = html;

    }


    /*
    ==================================================
    LOAD SAVED EAS
    ==================================================
    */

    async function loadEAs() {

      try {

        if (!supabaseClient) {

          throw new Error(
            "Supabase client was not found. Check supabase-config.js."
          );

        }


        eaContainer.innerHTML = `

          <div class="loading">
            <div class="spinner"></div>
            Loading your saved EAs...
          </div>

        `;


        /*
        ----------------------------------------------
        GET LOGGED-IN USER
        ----------------------------------------------
        */

        const {
          data: {
            user
          },
          error: userError
        } = await supabaseClient.auth.getUser();


        if (userError) {
          throw userError;
        }


        if (!user) {

          showMessage(
            "You are not logged in. Please log in to view your saved EAs.",
            "error"
          );


          eaContainer.innerHTML = `

            <div class="empty-state">

              <div class="empty-icon">🔒</div>

              <h3>Please log in</h3>

              <p>
                Log in to view and manage your saved Expert Advisors.
              </p>

              <a
                href="login.html"
                class="create-button"
              >
                Log In
              </a>

            </div>

          `;

          updateStats([]);

          return;

        }


        /*
        ----------------------------------------------
        LOAD ONLY THIS USER'S EAS

        Exact column:
        mentor_id
        ----------------------------------------------
        */

        const {
          data: eas,
          error: eaError
        } = await supabaseClient
          .from("ea_robots")
          .select(`
            id,
            mentor_id,
            name,
            description,
            platform,
            strategy,
            risk_level,
            version,
            status,
            created_at,
            updated_at,
            features
          `)
          .eq("mentor_id", user.id)
          .order("updated_at", {
            ascending: false
          });


        if (eaError) {

          console.error("Supabase error:", eaError);

          throw eaError;

        }


        renderEAs(eas || []);


      } catch (error) {

        console.error("Error loading EAs:", error);


        updateStats([]);


        showMessage(
          "Error loading your EAs: " +
          (error.message || "Unknown error"),
          "error"
        );


        eaContainer.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">⚠️</div>

            <h3>Could not load your EAs</h3>

            <p>
              ${escapeHTML(
                error.message ||
                "Please check your Supabase connection."
              )}
            </p>

            <button
              class="refresh-button"
              type="button"
              onclick="loadEAs()"
            >
              Try Again
            </button>

          </div>

        `;

      }

    }


    /*
    ==================================================
    EDIT EA

    Saves ID in localStorage AND sends ID in URL.

    This gives create-ea.html two ways to identify
    the EA being edited.
    ==================================================
    */

    function editEA(eaId) {

      if (!eaId) {

        showMessage(
          "Could not find the EA ID.",
          "error"
        );

        return;

      }


      /*
      Store EA ID for create-ea.html
      */

      localStorage.setItem(
        "alpha_edit_ea_id",
        eaId
      );


      /*
      Go to Create EA in edit mode
      */

      window.location.href =
        "create-ea.html?edit=" +
        encodeURIComponent(eaId);

    }


    /*
    ==================================================
    DELETE EA
    ==================================================
    */

    async function deleteEA(eaId, eaName) {

      try {

        if (!eaId) {

          throw new Error(
            "Could not find the EA ID."
          );

        }


        const confirmed = confirm(
          `Are you sure you want to delete "${eaName}"?\n\n` +
          `This action cannot be undone.`
        );


        if (!confirmed) {
          return;
        }


        showMessage(
          "Deleting EA...",
          "info"
        );


        /*
        ----------------------------------------------
        CHECK USER
        ----------------------------------------------
        */

        const {
          data: {
            user
          },
          error: userError
        } = await supabaseClient.auth.getUser();


        if (userError) {
          throw userError;
        }


        if (!user) {

          throw new Error(
            "You must be logged in to delete an EA."
          );

        }


        /*
        ----------------------------------------------
        DELETE

        Extra mentor_id check ensures the user only
        deletes their own EA.
        ----------------------------------------------
        */

        const {
          error: deleteError
        } = await supabaseClient
          .from("ea_robots")
          .delete()
          .eq("id", eaId)
          .eq("mentor_id", user.id);


        if (deleteError) {

          console.error(
            "Delete error:",
            deleteError
          );

          throw deleteError;

        }


        showMessage(
          `"${eaName}" was deleted successfully.`,
          "success"
        );


        await loadEAs();


      } catch (error) {

        console.error(
          "Error deleting EA:",
          error
        );


        showMessage(
          "Error deleting EA: " +
          (error.message || "Unknown error"),
          "error"
        );

      }

    }


    /*
    ==================================================
    REFRESH BUTTON
    ==================================================
    */

    refreshButton.addEventListener(
      "click",
      async function() {

        refreshButton.disabled = true;

        refreshButton.textContent =
          "Refreshing...";


        await loadEAs();


        refreshButton.disabled = false;

        refreshButton.textContent =
          "↻ Refresh";

      }
    );


    /*
    ==================================================
    PAGE LOAD
    ==================================================
    */

    document.addEventListener(
      "DOMContentLoaded",
      async function() {

        await loadEAs();

      }
    );

  </script>

</body>
</html>
