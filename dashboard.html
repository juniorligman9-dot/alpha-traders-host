<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dashboard | Alpha Traders Host</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #111a29;
      --bg-secondary: #1a2536;
      --card: #2a374a;
      --card-dark: #1b2738;
      --border: #3b4d66;
      --text: #e7e9ee;
      --muted: #b6bfce;
      --accent: #55c5b5;
      --accent-dark: #36a999;
      --danger: #ef6666;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.5;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      width: 100%;
      border-bottom: 1px solid var(--border);
      background: #131d2d;
    }

    .nav-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 26px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      text-decoration: none;
      color: var(--text);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--accent);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 0 28px;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      text-decoration: none;
      font-size: 18px;
      transition: 0.2s ease;
    }

    .nav-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-link.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(85, 197, 181, 0.06);
    }

    /* =========================
       MAIN
    ========================== */

    main {
      width: 100%;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }

    .hero {
      margin-bottom: 34px;
    }

    .hero h1 {
      font-size: clamp(42px, 6vw, 64px);
      line-height: 1.1;
      margin-bottom: 18px;
    }

    .hero p {
      color: var(--muted);
      font-size: clamp(19px, 2.5vw, 26px);
      max-width: 650px;
    }

    .create-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
      min-height: 66px;
      padding: 0 34px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        var(--accent),
        #4db6aa
      );
      color: #10201f;
      font-size: 20px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .create-button:hover {
      transform: translateY(-2px);
    }

    /* =========================
       STATS
    ========================== */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      margin-bottom: 42px;
    }

    .stat-card {
      width: 100%;
      min-height: 175px;
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-number {
      color: var(--accent);
      font-size: 50px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 16px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 20px;
    }

    /* =========================
       SAVED EAS
    ========================== */

    .saved-section {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 30px;
    }

    .saved-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .saved-header h2 {
      font-size: 36px;
      line-height: 1.2;
    }

    .refresh-button {
      min-height: 54px;
      padding: 0 24px;
      border: 1px solid var(--accent);
      border-radius: 16px;
      background: transparent;
      color: var(--accent);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .refresh-button:hover {
      background: rgba(85, 197, 181, 0.08);
    }

    .status-message {
      width: 100%;
      padding: 22px;
      border-radius: 18px;
      color: var(--muted);
      background: var(--card-dark);
      border: 1px solid var(--border);
      font-size: 18px;
    }

    .error-message {
      border-color: var(--danger);
      color: #ffc3c3;
      background: rgba(239, 102, 102, 0.08);
    }

    .ea-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .ea-card {
      width: 100%;
      padding: 26px;
      background: var(--card-dark);
      border: 1px solid var(--border);
      border-radius: 24px;
    }

    .ea-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .ea-name {
      font-size: 26px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .platform-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 14px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }

    .ea-meta {
      color: var(--muted);
      font-size: 17px;
      margin-bottom: 12px;
    }

    .ea-description {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 20px;
      overflow-wrap: anywhere;
    }

    .ea-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .edit-button,
    .view-button {
      min-height: 48px;
      padding: 0 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .edit-button {
      border: none;
      background: var(--accent);
      color: #10201f;
    }

    .view-button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    .empty-state {
      width: 100%;
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--card-dark);
      border: 1px dashed var(--border);
      border-radius: 22px;
    }

    .empty-state h3 {
      color: var(--text);
      font-size: 24px;
      margin-bottom: 10px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 800px) {
      .nav-container {
        padding: 28px 28px;
        flex-wrap: wrap;
        align-items: center;
      }

      .logo {
        width: 100%;
        font-size: 28px;
      }

      nav {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .nav-link {
        width: 100%;
        min-height: 58px;
        padding: 0 12px;
      }

      .container {
        padding: 46px 28px 70px;
      }

      .hero {
        margin-bottom: 32px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .stat-card {
        min-height: 155px;
      }

      .ea-list {
        grid-template-columns: 1fr;
      }

      .saved-section {
        padding: 24px;
      }
    }

    @media (max-width: 520px) {
      .nav-container {
        padding: 26px 20px;
      }

      .logo {
        font-size: 25px;
        letter-spacing: 1.5px;
      }

      .container {
        padding: 38px 20px 60px;
      }

      .hero h1 {
        font-size: 46px;
      }

      .hero p {
        font-size: 22px;
      }

      .create-button {
        width: 100%;
        min-height: 66px;
      }

      .stat-card {
        padding: 28px;
        border-radius: 25px;
      }

      .stat-number {
        font-size: 48px;
      }

      .saved-section {
        padding: 22px;
        border-radius: 26px;
      }

      .saved-header {
        flex-direction: column;
        align-items: stretch;
      }

      .saved-header h2 {
        font-size: 34px;
      }

      .refresh-button {
        width: 100%;
      }

      .ea-card {
        padding: 22px;
      }

      .ea-name {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>
    <div class="nav-container">

      <a href="index.html" class="logo">
        ALPHA <span>TRADERS HOST</span>
      </a>

      <nav>
        <a href="index.html" class="nav-link">
          Home
        </a>

        <a href="dashboard.html" class="nav-link active">
          Dashboard
        </a>
      </nav>

    </div>
  </header>


  <!-- =========================
       MAIN CONTENT
  ========================== -->

  <main>
    <div class="container">

      <section class="hero">
        <h1>Dashboard</h1>

        <p>
          Manage your Expert Advisors and view your saved EA configurations.
        </p>

        <a href="create-ea.html" class="create-button">
          + Create New EA
        </a>
      </section>


      <!-- =========================
           STATISTICS
      ========================== -->

      <section class="stats-grid">

        <div class="stat-card">
          <div class="stat-number" id="totalEAs">
            0
          </div>

          <div class="stat-label">
            Total EAs
          </div>
        </div>


        <div class="stat-card">
          <div class="stat-number" id="mt4EAs">
            0
          </div>

          <div class="stat-label">
            MT4 EAs
          </div>
        </div>


        <div class="stat-card">
          <div class="stat-number" id="mt5EAs">
            0
          </div>

          <div class="stat-label">
            MT5 EAs
          </div>
        </div>

      </section>


      <!-- =========================
           SAVED EAS
      ========================== -->

      <section class="saved-section">

        <div class="saved-header">

          <h2>My Saved EAs</h2>

          <button
            type="button"
            class="refresh-button"
            id="refreshButton"
          >
            ↻ Refresh
          </button>

        </div>


        <div
          id="eaContent"
          class="status-message"
        >
          Loading your saved EAs...
        </div>

      </section>

    </div>
  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /*
    ==================================================

      ALPHA TRADERS HOST
      DASHBOARD

      EXACT ea_robots TABLE COLUMNS:

      id
      mentor_id
      name
      description
      platform
      strategy
      risk_level
      version
      status
      created_at
      updated_at
      features

    ==================================================
    */


    const totalEAsElement =
      document.getElementById("totalEAs");

    const mt4EAsElement =
      document.getElementById("mt4EAs");

    const mt5EAsElement =
      document.getElementById("mt5EAs");

    const eaContent =
      document.getElementById("eaContent");

    const refreshButton =
      document.getElementById("refreshButton");


    /*
    ==================================================
      CHECK SUPABASE CLIENT
    ==================================================
    */

    function getSupabaseClient() {

      if (
        typeof window.supabaseClient !== "undefined"
      ) {
        return window.supabaseClient;
      }

      return null;

    }


    /*
    ==================================================
      ESCAPE HTML
      Prevents database text from breaking the page
    ==================================================
    */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
    ==================================================
      FORMAT PLATFORM
    ==================================================
    */

    function formatPlatform(platform) {

      if (!platform) {
        return "MT5";
      }

      return String(platform)
        .toUpperCase();

    }


    /*
    ==================================================
      LOAD DASHBOARD
    ==================================================
    */

    async function loadDashboard() {

      const supabaseClient =
        getSupabaseClient();


      /*
      ----------------------------------------------
        SUPABASE CONFIG ERROR
      ----------------------------------------------
      */

      if (!supabaseClient) {

        eaContent.className =
          "status-message error-message";

        eaContent.innerHTML = `
          Supabase is not connected.

          <br><br>

          Make sure your
          <strong>supabase-config.js</strong>
          file is in the same folder as
          <strong>dashboard.html</strong>.
        `;

        return;

      }


      /*
      ----------------------------------------------
        SHOW LOADING
      ----------------------------------------------
      */

      eaContent.className =
        "status-message";

      eaContent.textContent =
        "Loading your saved EAs...";


      refreshButton.disabled = true;

      refreshButton.textContent =
        "Loading...";


      try {

        /*
        --------------------------------------------
          GET CURRENT AUTHENTICATED USER
        --------------------------------------------
        */

        const {
          data: userData,
          error: userError
        } =
          await supabaseClient.auth.getUser();


        if (userError) {
          throw userError;
        }


        const user =
          userData?.user;


        /*
        --------------------------------------------
          USER NOT LOGGED IN

          We still try to load visible EAs.
          This helps if your current RLS policy
          allows reading records.
        --------------------------------------------
        */


        let query =
          supabaseClient
            .from("ea_robots")
            .select(`
              id,
              mentor_id,
              name,
              description,
              platform,
              strategy,
              risk_level,
              version,
              status,
              created_at,
              updated_at,
              features
            `)
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        /*
        --------------------------------------------
          FILTER BY mentor_id

          Your table uses mentor_id.
          Only filter when a logged-in user exists.
        --------------------------------------------
        */

        if (user && user.id) {

          query =
            query.eq(
              "mentor_id",
              user.id
            );

        }


        /*
        --------------------------------------------
          RUN QUERY
        --------------------------------------------
        */

        const {
          data: eas,
          error
        } =
          await query;


        if (error) {
          throw error;
        }


        /*
        --------------------------------------------
          ENSURE ARRAY
        --------------------------------------------
        */

        const robots =
          Array.isArray(eas)
            ? eas
            : [];


        /*
        --------------------------------------------
          UPDATE STATISTICS
        --------------------------------------------
        */

        updateStatistics(robots);


        /*
        --------------------------------------------
          RENDER EAS
        --------------------------------------------
        */

        renderEAs(robots);


      }
      catch (error) {

        console.error(
          "Dashboard loading error:",
          error
        );


        totalEAsElement.textContent =
          "0";

        mt4EAsElement.textContent =
          "0";

        mt5EAsElement.textContent =
          "0";


        eaContent.className =
          "status-message error-message";


        eaContent.innerHTML = `
          <strong>Could not load your EAs.</strong>

          <br><br>

          ${escapeHTML(
            error.message ||
            "Unknown error"
          )}

          <br><br>

          Check that:

          <br>
          • <strong>ea_robots</strong> exists
          <br>
          • The column names match your table
          <br>
          • Your Supabase RLS policies allow access
          <br>
          • <strong>supabase-config.js</strong> is correct
        `;

      }
      finally {

        refreshButton.disabled =
          false;

        refreshButton.textContent =
          "↻ Refresh";

      }

    }


    /*
    ==================================================
      UPDATE STATISTICS
    ==================================================
    */

    function updateStatistics(eas) {

      const total =
        eas.length;


      const mt4 =
        eas.filter(function (ea) {

          return (
            String(
              ea.platform || ""
            )
            .toUpperCase() === "MT4"
          );

        })
        .length;


      const mt5 =
        eas.filter(function (ea) {

          return (
            String(
              ea.platform || "MT5"
            )
            .toUpperCase() === "MT5"
          );

        })
        .length;


      totalEAsElement.textContent =
        total;

      mt4EAsElement.textContent =
        mt4;

      mt5EAsElement.textContent =
        mt5;

    }


    /*
    ==================================================
      RENDER EAS
    ==================================================
    */

    function renderEAs(eas) {

      /*
      ----------------------------------------------
        NO EAS
      ----------------------------------------------
      */

      if (!eas || eas.length === 0) {

        eaContent.className = "";


        eaContent.innerHTML = `

          <div class="empty-state">

            <h3>
              No saved EAs yet
            </h3>

            <p>
              Create your first Expert Advisor
              to see it here.
            </p>

            <br>

            <a
              href="create-ea.html"
              class="create-button"
              style="
                margin-top: 0;
                min-height: 54px;
                font-size: 17px;
              "
            >
              + Create New EA
            </a>

          </div>

        `;

        return;

      }


      /*
      ----------------------------------------------
        CREATE LIST
      ----------------------------------------------
      */

      let html =
        `<div class="ea-list
