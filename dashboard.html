<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Mentor Dashboard | Alpha Traders Host</title>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    :root {

      --bg: #111a29;
      --bg-secondary: #1a2536;
      --card: #2a374a;
      --card-dark: #1b2738;
      --border: #3b4d66;

      --text: #e7e9ee;
      --muted: #b6bfce;

      --accent: #55c5b5;
      --accent-dark: #36a999;

      --danger: #ef6666;
      --warning: #f5b942;
      --success: #55c5b5;

    }


    html,
    body {

      width: 100%;
      min-height: 100%;
      overflow-x: hidden;

    }


    body {

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.5;

    }


    /* =========================
       HEADER
    ========================== */

    header {

      width: 100%;

      border-bottom:
        1px solid var(--border);

      background:
        #131d2d;

    }


    .nav-container {

      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding:
        22px 32px;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 24px;

    }


    .logo {

      text-decoration: none;

      color:
        var(--text);

      font-size:
        26px;

      font-weight:
        800;

      letter-spacing:
        1.5px;

      white-space:
        nowrap;

    }


    .logo span {

      color:
        var(--accent);

    }


    nav {

      display: flex;

      align-items: center;

      gap: 12px;

    }


    .nav-link,
    .logout-button {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      min-height:
        48px;

      padding:
        0 20px;

      border:
        1px solid var(--border);

      border-radius:
        14px;

      color:
        var(--text);

      background:
        transparent;

      text-decoration:
        none;

      font-size:
        15px;

      font-weight:
        700;

      cursor:
        pointer;

    }


    .nav-link:hover {

      border-color:
        var(--accent);

      color:
        var(--accent);

    }


    .nav-link.active {

      border-color:
        var(--accent);

      color:
        var(--accent);

    }


    .logout-button:hover {

      border-color:
        var(--danger);

      color:
        var(--danger);

    }


    /* =========================
       MAIN
    ========================== */

    .container {

      width: 100%;

      max-width:
        1200px;

      margin:
        0 auto;

      padding:
        48px 32px 80px;

    }


    .hero {

      margin-bottom:
        34px;

    }


    .hero h1 {

      font-size:
        clamp(40px, 6vw, 62px);

      line-height:
        1.1;

      margin-bottom:
        15px;

    }


    .hero p {

      color:
        var(--muted);

      font-size:
        clamp(17px, 2.5vw, 22px);

      max-width:
        700px;

    }


    .create-button {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      margin-top:
        28px;

      min-height:
        60px;

      padding:
        0 30px;

      border:
        none;

      border-radius:
        16px;

      background:
        var(--accent);

      color:
        #10201f;

      font-size:
        18px;

      font-weight:
        800;

      text-decoration:
        none;

      cursor:
        pointer;

    }


    .create-button:hover {

      background:
        var(--accent-dark);

    }


    /* =========================
       STATS
    ========================== */

    .stats-grid {

      display:
        grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap:
        20px;

      margin-bottom:
        35px;

    }


    .stat-card {

      min-height:
        155px;

      padding:
        28px;

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        24px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

    }


    .stat-number {

      color:
        var(--accent);

      font-size:
        46px;

      font-weight:
        800;

      line-height:
        1;

      margin-bottom:
        14px;

    }


    .stat-label {

      color:
        var(--muted);

      font-size:
        18px;

    }


    /* =========================
       SECTIONS
    ========================== */

    .dashboard-section {

      width:
        100%;

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        28px;

      padding:
        28px;

      margin-bottom:
        30px;

    }


    .section-header {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        18px;

      margin-bottom:
        24px;

    }


    .section-header h2 {

      font-size:
        32px;

      line-height:
        1.2;

    }


    .refresh-button {

      min-height:
        48px;

      padding:
        0 20px;

      border:
        1px solid var(--accent);

      border-radius:
        14px;

      background:
        transparent;

      color:
        var(--accent);

      font-size:
        15px;

      font-weight:
        700;

      cursor:
        pointer;

      white-space:
        nowrap;

    }


    .refresh-button:hover {

      background:
        rgba(85, 197, 181, 0.08);

    }


    .refresh-button:disabled {

      opacity:
        0.6;

      cursor:
        not-allowed;

    }


    /* =========================
       STATUS
    ========================== */

    .status-message {

      width:
        100%;

      padding:
        22px;

      border-radius:
        18px;

      color:
        var(--muted);

      background:
        var(--card-dark);

      border:
        1px solid var(--border);

      font-size:
        17px;

    }


    .error-message {

      border-color:
        var(--danger);

      color:
        #ffc3c3;

      background:
        rgba(239, 102, 102, 0.08);

    }


    .empty-state {

      width:
        100%;

      padding:
        42px 20px;

      text-align:
        center;

      color:
        var(--muted);

      background:
        var(--card-dark);

      border:
        1px dashed var(--border);

      border-radius:
        20px;

    }


    .empty-state h3 {

      color:
        var(--text);

      font-size:
        23px;

      margin-bottom:
        10px;

    }


    /* =========================
       CLIENT REQUESTS
    ========================== */

    .request-list {

      display:
        grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        18px;

    }


    .request-card {

      background:
        var(--card-dark);

      border:
        1px solid var(--border);

      border-radius:
        22px;

      padding:
        24px;

    }


    .request-top {

      display:
        flex;

      align-items:
        flex-start;

      justify-content:
        space-between;

      gap:
        14px;

      margin-bottom:
        14px;

    }


    .client-name {

      font-size:
        23px;

      font-weight:
        800;

      overflow-wrap:
        anywhere;

    }


    .client-email {

      color:
        var(--muted);

      font-size:
        15px;

      margin-bottom:
        14px;

      overflow-wrap:
        anywhere;

    }


    .request-date {

      color:
        var(--muted);

      font-size:
        14px;

      margin-bottom:
        18px;

    }


    .status-badge {

      flex-shrink:
        0;

      display:
        inline-flex;

      padding:
        6px 12px;

      border-radius:
        999px;

      font-size:
        13px;

      font-weight:
        800;

      text-transform:
        uppercase;

    }


    .status-pending {

      border:
        1px solid var(--warning);

      color:
        var(--warning);

    }


    .status-approved {

      border:
        1px solid var(--success);

      color:
        var(--success);

    }


    .status-rejected {

      border:
        1px solid var(--danger);

      color:
        var(--danger);

    }


    .request-actions {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        10px;

    }


    .approve-button,
    .reject-button {

      min-height:
        46px;

      padding:
        0 18px;

      border-radius:
        12px;

      font-size:
        15px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    .approve-button {

      border:
        none;

      background:
        var(--accent);

      color:
        #10201f;

    }


    .reject-button {

      border:
        1px solid var(--danger);

      background:
        transparent;

      color:
        var(--danger);

    }


    .approve-button:disabled,
    .reject-button:disabled {

      opacity:
        0.6;

      cursor:
        not-allowed;

    }


    /* =========================
       EAs
    ========================== */

    .ea-list {

      display:
        grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        20px;

    }


    .ea-card {

      width:
        100%;

      padding:
        25px;

      background:
        var(--card-dark);

      border:
        1px solid var(--border);

      border-radius:
        22px;

    }


    .ea-top {

      display:
        flex;

      align-items:
        flex-start;

      justify-content:
        space-between;

      gap:
        15px;

      margin-bottom:
        14px;

    }


    .ea-name {

      font-size:
        24px;

      font-weight:
        800;

      overflow-wrap:
        anywhere;

    }


    .platform-badge {

      flex-shrink:
        0;

      padding:
        6px 12px;

      border:
        1px solid var(--accent);

      border-radius:
        999px;

      color:
        var(--accent);

      font-size:
        13px;

      font-weight:
        800;

    }


    .ea-meta {

      color:
        var(--muted);

      font-size:
        16px;

      margin-bottom:
        12px;

    }


    .ea-description {

      color:
        var(--muted);

      font-size:
        15px;

      margin-bottom:
        18px;

      overflow-wrap:
        anywhere;

    }


    .ea-actions {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        10px;

    }


    .edit-button,
    .view-button {

      min-height:
        46px;

      padding:
        0 18px;

      border-radius:
        12px;

      font-size:
        15px;

      font-weight:
        700;

      cursor:
        pointer;

      text-decoration:
        none;

    }


    .edit-button {

      border:
        none;

      background:
        var(--accent);

      color:
        #10201f;

    }


    .view-button {

      border:
        1px solid var(--border);

      background:
        transparent;

      color:
        var(--text);

    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 800px) {

      .nav-container {

        padding:
          22px 24px;

        flex-direction:
          column;

        align-items:
          stretch;

      }


      .logo {

        text-align:
          center;

      }


      nav {

        width:
          100%;

        display:
          grid;

        grid-template-columns:
          1fr 1fr;

      }


      .nav-link,
      .logout-button {

        width:
          100%;

      }


      .container {

        padding:
          40px 24px 65px;

      }


      .stats-grid {

        grid-template-columns:
          1fr;

      }


      .request-list,
      .ea-list {

        grid-template-columns:
          1fr;

      }

    }


    @media (max-width: 520px) {

      .nav-container {

        padding:
          20px;

      }


      .container {

        padding:
          34px 18px 55px;

      }


      .hero h1 {

        font-size:
          42px;

      }


      .dashboard-section {

        padding:
          20px;

        border-radius:
          24px;

      }


      .section-header {

        flex-direction:
          column;

        align-items:
          stretch;

      }


      .refresh-button {

        width:
          100%;

      }


      .request-card,
      .ea-card {

        padding:
          20px;

      }


      .request-top,
      .ea-top {

        flex-direction:
          column;

      }

    }

  </style>

</head>

  <!-- =========================

  <script>


    /*
    ==============================================
      GLOBAL VARIABLES
    ==============================================
    */

    let currentUser = null;

    let currentProfile = null;



    /*
    ==============================================
      DOM ELEMENTS
    ==============================================
    */

    const totalEAsElement =
      document.getElementById("totalEAs");


    const mt4EAsElement =
      document.getElementById("mt4EAs");


    const mt5EAsElement =
      document.getElementById("mt5EAs");


    const eaContent =
      document.getElementById("eaContent");


    const requestsContent =
      document.getElementById("requestsContent");


    const refreshEAsButton =
      document.getElementById(
        "refreshEAsButton"
      );


    const refreshRequestsButton =
      document.getElementById(
        "refreshRequestsButton"
      );


    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    const welcomeTitle =
      document.getElementById(
        "welcomeTitle"
      );



    /*
    ==============================================
      GET SUPABASE CLIENT
    ==============================================
    */

    function getSupabaseClient() {

      if (
        typeof window.supabaseClient !==
        "undefined"
      ) {

        return window.supabaseClient;

      }


      return null;

    }



    /*
    ==============================================
      ESCAPE HTML
    ==============================================
    */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    /*
    ==============================================
      CHECK MENTOR ACCESS
    ==============================================
    */

    async function checkMentorAccess() {


      const supabaseClient =
        getSupabaseClient();


      if (!supabaseClient) {

        throw new Error(
          "Supabase is not connected. Check supabase-config.js."
        );

      }



      /*
        GET AUTHENTICATED USER
      */

      const {

        data: userData,

        error: userError

      } =
        await supabaseClient
          .auth
          .getUser();



      if (
        userError ||
        !userData ||
        !userData.user
      ) {

        window.location.href =
          "login.html";

        return false;

      }



      currentUser =
        userData.user;



      /*
        GET USER PROFILE
      */

      const {

        data: profile,

        error: profileError

      } =
        await supabaseClient

          .from("profiles")

          .select(
            "id, full_name, email, role, approval_status"
          )

          .eq(
            "id",
            currentUser.id
          )

          .single();



      if (
        profileError ||
        !profile
      ) {

        console.error(
          "Profile error:",
          profileError
        );


        await supabaseClient
          .auth
          .signOut();


        window.location.href =
          "login.html";

        return false;

      }



      currentProfile =
        profile;



      const role =
        String(
          profile.role || ""
        )
          .toLowerCase()
          .trim();



      const approvalStatus =
        String(
          profile.approval_status || ""
        )
          .toLowerCase()
          .trim();



      /*
        CLIENT ACCESS
      */

      if (
        role === "client"
      ) {


        if (
          approvalStatus !== "approved"
        ) {

          await supabaseClient
            .auth
            .signOut();


          window.location.href =
            "login.html";

          return false;

        }


        window.location.href =
          "client-dashboard.html";

        return false;

      }



      /*
        MENTOR ACCESS
      */

      if (
        role !== "mentor" ||
        approvalStatus !== "approved"
      ) {


        await supabaseClient
          .auth
          .signOut();


        alert(
          "Your mentor account has not been approved yet."
        );


        window.location.href =
          "login.html";

        return false;

      }



      /*
        DISPLAY FIRST NAME
      */

      const fullName =
        String(
          profile.full_name || ""
        ).trim();



      const firstName =
        fullName
          ? fullName.split(" ")[0]
          : "";



      if (firstName) {

        welcomeTitle.textContent =
          "Welcome, " +
          firstName;

      }


      return true;

    }



    /*
    ==============================================
      LOAD CLIENT REQUESTS
    ==============================================
    */

    async function loadMentorRequests() {


      const supabaseClient =
        getSupabaseClient();


      if (
        !supabaseClient ||
        !currentUser
      ) {

        return;

      }



      requestsContent.innerHTML =
        `
          <div class="status-message">
            Loading client requests...
          </div>
        `;



      refreshRequestsButton.disabled =
        true;


      refreshRequestsButton.textContent =
        "Loading...";



      try {


        /*
          GET REQUESTS
        */

        const {

          data: requests,

          error

        } =
          await supabaseClient

            .from("mentor_requests")

            .select(`
              id,
              client_id,
              mentor_id,
              status,
              created_at,
              updated_at
            `)

            .eq(
              "mentor_id",
              currentUser.id
            )

            .order(
              "created_at",
              {
                ascending: false
              }
            );



        if (error) {

          throw error;

        }



        const requestList =
          Array.isArray(requests)
            ? requests
            : [];



        /*
          GET UNIQUE CLIENT IDS
        */

        const clientIds =
          [
            ...new Set(

              requestList

                .map(
                  function(request) {

                    return request.client_id;

                  }
                )

                .filter(Boolean)

            )
          ];



        let clients = [];



        /*
          LOAD CLIENT PROFILES
        */

        if (
          clientIds.length > 0
        ) {


          const {

            data: clientProfiles,

            error: clientsError

          } =
            await supabaseClient

              .from("profiles")

              .select(
                "id, full_name, email"
              )

              .in(
                "id",
                clientIds
              );



          if (clientsError) {

            throw clientsError;

          }



          clients =
            Array.isArray(
              clientProfiles
            )
              ? clientProfiles
              : [];

        }



        /*
          CREATE CLIENT MAP
        */

        const clientMap = {};



        clients.forEach(
          function(client) {

            clientMap[
              client.id
            ] =
              client;

          }
        );



        /*
          ATTACH CLIENT DATA
        */

        const requestsWithClients =
          requestList.map(
            function(request) {

              return {

                ...request,

                client:

                  clientMap[
                    request.client_id
                  ]

                  ||

                  null

              };

            }
          );



        renderMentorRequests(
          requestsWithClients
        );


      }


      catch (error) {


        console.error(
          "Mentor request error:",
          error
        );



        requestsContent.innerHTML =
          `
            <div class="status-message error-message">

              <strong>
                Could not load client requests.
              </strong>

              <br><br>

              ${escapeHTML(
                error.message ||
                "Unknown error"
              )}

            </div>
          `;

      }


      finally {


        refreshRequestsButton.disabled =
          false;


        refreshRequestsButton.textContent =
          "↻ Refresh Requests";

      }

    }



    /*
    ==============================================
      RENDER CLIENT REQUESTS
    ==============================================
    */

    function renderMentorRequests(
      requests
    ) {


      if (
        !requests ||
        requests.length === 0
      ) {


        requestsContent.innerHTML =
          `
            <div class="empty-state">

              <h3>
                No client requests yet
              </h3>

              <p>
                When clients request you as a mentor,
                their requests will appear here.
              </p>

            </div>
          `;


        return;

      }



      let html =
        `<div class="request-list">`;



      requests.forEach(
        function(request) {


          const client =
            request.client ||
            {};



          const status =
            String(
              request.status ||
              "pending"
            )
              .toLowerCase()
              .trim();



          let statusClass =
            "status-pending";



          if (
            status === "approved"
          ) {

            statusClass =
              "status-approved";

          }


          else if (
            status === "rejected"
          ) {

            statusClass =
              "status-rejected";

          }



          let requestDate =
            "Date unavailable";



          if (
            request.created_at
          ) {


            const date =
              new Date(
                request.created_at
              );


            if (
              !isNaN(
                date.getTime()
              )
            ) {

              requestDate =
                date.toLocaleDateString();

            }

          }



          html +=
            `

              <article class="request-card">


                <div class="request-top">


                  <div class="client-name">

                    ${escapeHTML(
                      client.full_name ||
                      "Client"
                    )}

                  </div>



                  <span
                    class="
                      status-badge
                      ${statusClass}
                    "
                  >

                    ${escapeHTML(
                      status
                    )}

                  </span>


                </div>



                <div class="client-email">

                  ${escapeHTML(
                    client.email ||
                    "Email unavailable"
                  )}

                </div>



                <div class="request-date">

                  Requested:

                  ${escapeHTML(
                    requestDate
                  )}

                </div>



                ${
                  status === "pending"

                    ?

                    `

                      <div class="request-actions">


                        <button
                          type="button"
                          class="approve-button"
                          onclick="
                            updateRequestStatus(
                              '${request.id}',
                              'approved'
                            )
                          "
                        >

                          ✓ Accept

                        </button>



                        <button
                          type="button"
                          class="reject-button"
                          onclick="
                            updateRequestStatus(
                              '${request.id}',
                              'rejected'
                            )
                          "
                        >

                          ✕ Reject

                        </button>


                      </div>

                    `


                    :

                    `

                      <div class="request-date">

                        This request has already been
                        ${escapeHTML(status)}.

                      </div>

                    `

                }


              </article>

            `;

        }
      );



      html +=
        `</div>`;



      requestsContent.innerHTML =
        html;

    }



    /*
    ==============================================
      UPDATE REQUEST STATUS
    ==============================================
    */

    async function updateRequestStatus(
      requestId,
      newStatus
    ) {


      if (
        !requestId ||
        !currentUser
      ) {

        return;

      }



      if (
        newStatus !== "approved" &&
        newStatus !== "rejected"
      ) {

        alert(
          "Invalid request status."
        );

        return;

      }



      const action =
        newStatus === "approved"
          ? "accept"
          : "reject";



      const confirmed =
        confirm(
          "Are you sure you want to " +
          action +
          " this client request?"
        );



      if (!confirmed) {

        return;

      }



      const supabaseClient =
        getSupabaseClient();



      if (!supabaseClient) {

        alert(
          "Supabase is not connected."
        );

        return;

      }



      try {


        const {

          data,

          error

        } =
          await supabaseClient

            .from("mentor_requests")

            .update({

              status:
                newStatus,

              updated_at:
                new Date()
                  .toISOString()

            })

            .eq(
              "id",
              requestId
            )

            .eq(
              "mentor_id",
              currentUser.id
            )

            .select();



        if (error) {

          throw error;

        }



        /*
          CHECK THAT A ROW WAS ACTUALLY UPDATED
        */

        if (
          !data ||
          data.length === 0
        ) {

          throw new Error(
            "Request was not updated. You may not have permission."
          );

        }



        alert(

          newStatus === "approved"

            ?

            "Client request accepted!"

            :

            "Client request rejected!"

        );



        await loadMentorRequests();


      }


      catch (error) {


        console.error(
          "Request update error:",
          error
        );



        alert(

          "Could not update request: " +

          (
            error.message ||
            "Unknown error"
          )

        );

      }

    }



    /*
    ==============================================
      LOAD EAs
    ==============================================
    */

    async function loadEAs() {


      const supabaseClient =
        getSupabaseClient();



      if (
        !supabaseClient ||
        !currentUser
      ) {

        return;

      }



      eaContent.className =
        "status-message";


      eaContent.textContent =
        "Loading your saved EAs...";



      refreshEAsButton.disabled =
        true;


      refreshEAsButton.textContent =
        "Loading...";



      try {


        const {

          data: eas,

          error

        } =
          await supabaseClient

            .from("ea_robots")

            .select(`
              id,
              mentor_id,
              name,
              description,
              platform,
              strategy,
              risk_level,
              version,
              status,
              created_at,
              updated_at,
              features
            `)

            .eq(
              "mentor_id",
              currentUser.id
            )

            .order(
              "created_at",
              {
                ascending: false
              }
            );



        if (error) {

          throw error;

        }



        const robots =
          Array.isArray(eas)
            ? eas
            : [];



        updateStatistics(
          robots
        );



        renderEAs(
          robots
        );


      }


      catch (error) {


        console.error(
          "EA loading error:",
          error
        );



        totalEAsElement.textContent =
          "0";


        mt4EAsElement.textContent =
          "0";


        mt5EAsElement.textContent =
          "0";



        eaContent.className =
          "status-message error-message";



        eaContent.innerHTML =
          `

            <strong>
              Could not load your EAs.
            </strong>

            <br><br>

            ${escapeHTML(
              error.message ||
              "Unknown error"
            )}

          `;

      }


      finally {


        refreshEAsButton.disabled =
          false;


        refreshEAsButton.textContent =
          "↻ Refresh EAs";

      }

    }



    /*
    ==============================================
      UPDATE EA STATISTICS
    ==============================================
    */

    function updateStatistics(
      eas
    ) {


      const total =
        eas.length;



      const mt4 =
        eas.filter(
          function(ea) {

            return String(
              ea.platform || ""
            )
              .toUpperCase()
              .trim()
              ===
              "MT4";

          }
        ).length;



      const mt5 =
        eas.filter(
          function(ea) {

            return String(
              ea.platform || ""
            )
              .toUpperCase()
              .trim()
              ===
              "MT5";

          }
        ).length;



      totalEAsElement.textContent =
        total;


      mt4EAsElement.textContent =
        mt4;


      mt5EAsElement.textContent =
        mt5;

    }



    /*
    ==============================================
      FORMAT PLATFORM
    ==============================================
    */

    function formatPlatform(
      platform
    ) {


      if (!platform) {

        return "Not specified";

      }


      return String(
        platform
      )
        .toUpperCase()
        .trim();

    }



    /*
    ==============================================
      RENDER EAs
    ==============================================
    */

    function renderEAs(
      eas
    ) {


      if (
        !eas ||
        eas.length === 0
      ) {


        eaContent.className =
          "";



        eaContent.innerHTML =
          `

            <div class="empty-state">

              <h3>
                No saved EAs yet
              </h3>


              <p>
                Create your first Expert Advisor
                to see it here.
              </p>


              <br>


              <a
                href="create-ea.html"
                class="create-button"
                style="
                  margin-top: 0;
                  min-height: 52px;
                  font-size: 16px;
                "
              >
                + Create New EA
              </a>

            </div>

          `;


        return;

      }



      let html =
        `<div class="ea-list">`;



      eas.forEach(
        function(ea) {


          const id =
            ea.id || "";



          const name =
            escapeHTML(
              ea.name ||
              "Unnamed EA"
            );



          const platform =
            escapeHTML(
              formatPlatform(
                ea.platform
              )
            );



          const strategy =
            escapeHTML(
              ea.strategy ||
              "Not specified"
            );



          const riskLevel =
            escapeHTML(
              ea.risk_level ||
              "Not specified"
            );



          const version =
            escapeHTML(
              ea.version ||
              "1.0"
            );



          const description =
            escapeHTML(
              ea.description ||
              "No description available."
            );



          html +=
            `

              <article class="ea-card">


                <div class="ea-top">


                  <div class="ea-name">

                    ${name}

                  </div>



                  <div class="platform-badge">

                    ${platform}

                  </div>


                </div>



                <div class="ea-meta">


                  Strategy:

                  ${strategy}


                  <br>


                  Risk:

                  ${riskLevel}


                  <br>


                  Version:

                  ${version}


                </div>



                <p class="ea-description">

                  ${description}

                </p>



                <div class="ea-actions">


                  <button
                    type="button"
                    class="edit-button"
                    onclick="
                      editEA(
                        '${id}'
                      )
                    "
                  >

                    ✏ Edit EA

                  </button>



                  <button
                    type="button"
                    class="view-button"
                    onclick="
                      viewEA(
                        '${id}'
                      )
                    "
                  >

                    View Details

                  </button>


                </div>


              </article>

            `;

        }
      );



      html +=
        `</div>`;



      eaContent.className =
        "";


      eaContent.innerHTML =
        html;

    }



    /*
    ==============================================
      EDIT EA
    ==============================================
    */

    function editEA(
      id
    ) {


      if (!id) {

        alert(
          "EA ID could not be found."
        );

        return;

      }



      window.location.href =
        "create-ea.html?id=" +
        encodeURIComponent(id);

    }



    /*
    ==============================================
      VIEW EA
    ==============================================
    */

    async function viewEA(
      id
    ) {


      if (!id) {

        alert(
          "EA ID could not be found."
        );

        return;

      }



      const supabaseClient =
        getSupabaseClient();



      if (!supabaseClient) {

        alert(
          "Supabase is not connected."
        );

        return;

      }



      try {


        const {

          data,

          error

        } =
          await supabaseClient

            .from("ea_robots")

            .select(`
              name,
              description,
              platform,
              strategy,
              risk_level,
              version,
              status,
              features,
              created_at
            `)

            .eq(
              "id",
              id
            )

            .eq(
              "mentor_id",
              currentUser.id
            )

            .single();



        if (error) {

          throw error;

        }



        const features =
          data.features

            ?

            JSON.stringify(
              data.features,
              null,
              2
            )

            :

            "No features configured";



        alert(

          "EA DETAILS\n\n" +

          "Name: " +

          (
            data.name ||
            "Unnamed EA"
          ) +


          "\n\nPlatform: " +

          formatPlatform(
            data.platform
          ) +


          "\nStrategy: " +

          (
            data.strategy ||
            "Not specified"
          ) +


          "\nRisk Level: " +

          (
            data.risk_level ||
            "Not specified"
          ) +


          "\nVersion: " +

          (
            data.version ||
            "1.0"
          ) +


          "\nStatus: " +

          (
            data.status ||
            "draft"
          ) +


          "\n\nDescription:\n" +

          (
            data.description ||
            "No description"
          ) +


          "\n\nFeatures:\n" +

          features

        );


      }


      catch (error) {


        console.error(
          "EA details error:",
          error
        );


        alert(

          "Could not load EA details: " +

          (
            error.message ||
            "Unknown error"
          )

        );

      }

    }



    /*
    ==============================================
      LOGOUT
    ==============================================
    */

    logoutButton.addEventListener(
      "click",
      async function() {


        const supabaseClient =
          getSupabaseClient();



        try {


          if (supabaseClient) {

            await supabaseClient
              .auth
              .signOut();

          }


        }


        catch (error) {


          console.error(
            "Logout error:",
            error
          );

        }


        window.location.href =
          "login.html";


      }
    );



    /*
    ==============================================
      REFRESH EAs
    ==============================================
    */

    refreshEAsButton.addEventListener(
      "click",
      function() {

        loadEAs();

      }
    );



    /*
    ==============================================
      REFRESH REQUESTS
    ==============================================
    */

    refreshRequestsButton.addEventListener(
      "click",
      function() {

        loadMentorRequests();

      }
    );



    /*
    ==============================================
      INITIALIZE DASHBOARD
    ==============================================
    */

    async function initializeDashboard() {


      try {


        const allowed =
          await checkMentorAccess();



        if (!allowed) {

          return;

        }



        await Promise.all([

          loadEAs(),

          loadMentorRequests()

        ]);


      }


      catch (error) {


        console.error(
          "Dashboard initialization error:",
          error
        );



        eaContent.className =
          "status-message error-message";



        eaContent.textContent =
          "Dashboard error: " +

          (
            error.message ||
            "Unknown error"
          );


        requestsContent.innerHTML =
          `

            <div class="status-message error-message">

              Dashboard error:

              ${escapeHTML(
                error.message ||
                "Unknown error"
              )}

            </div>

          `;

      }

    }



    /*
    ==============================================
      START DASHBOARD
    ==============================================
    */

    document.addEventListener(
      "DOMContentLoaded",
      initializeDashboard
    );


  </script>


</body>
