<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dashboard | Alpha Traders Host</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #111a29;
      --bg-secondary: #1a2536;
      --card: #2a374a;
      --card-dark: #1b2738;
      --border: #3b4d66;
      --text: #e7e9ee;
      --muted: #b6bfce;
      --accent: #55c5b5;
      --accent-dark: #36a999;
      --danger: #ef6666;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.5;
    }

    /* HEADER */

    header {
      width: 100%;
      border-bottom: 1px solid var(--border);
      background: #131d2d;
    }

    .nav-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      text-decoration: none;
      color: var(--text);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--accent);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 26px;
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--text);
      text-decoration: none;
      font-size: 17px;
    }

    .nav-link.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(85, 197, 181, 0.06);
    }

    /* MAIN */

    main {
      width: 100%;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }

    .hero {
      margin-bottom: 34px;
    }

    .hero h1 {
      font-size: clamp(42px, 6vw, 64px);
      line-height: 1.1;
      margin-bottom: 18px;
    }

    .hero p {
      color: var(--muted);
      font-size: clamp(19px, 2.5vw, 26px);
      max-width: 650px;
    }

    .create-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
      min-height: 64px;
      padding: 0 34px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        var(--accent),
        #4db6aa
      );
      color: #10201f;
      font-size: 19px;
      font-weight: 800;
      text-decoration: none;
    }

    /* STATS */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      margin-bottom: 42px;
    }

    .stat-card {
      width: 100%;
      min-height: 175px;
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-number {
      color: var(--accent);
      font-size: 50px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 16px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 20px;
    }

    /* SAVED EAS */

    .saved-section {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 30px;
    }

    .saved-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .saved-header h2 {
      font-size: 36px;
      line-height: 1.2;
    }

    .refresh-button {
      min-height: 54px;
      padding: 0 24px;
      border: 1px solid var(--accent);
      border-radius: 16px;
      background: transparent;
      color: var(--accent);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .refresh-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-message {
      width: 100%;
      padding: 22px;
      border-radius: 18px;
      color: var(--muted);
      background: var(--card-dark);
      border: 1px solid var(--border);
      font-size: 18px;
    }

    .error-message {
      border-color: var(--danger);
      color: #ffc3c3;
      background: rgba(239, 102, 102, 0.08);
    }

    .ea-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .ea-card {
      width: 100%;
      padding: 26px;
      background: var(--card-dark);
      border: 1px solid var(--border);
      border-radius: 24px;
    }

    .ea-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .ea-name {
      font-size: 26px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .platform-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 14px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }

    .ea-meta {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 14px;
      line-height: 1.7;
    }

    .ea-description {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 20px;
      overflow-wrap: anywhere;
    }

    .ea-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .edit-button,
    .view-button {
      min-height: 48px;
      padding: 0 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .edit-button {
      border: none;
      background: var(--accent);
      color: #10201f;
    }

    .view-button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    .empty-state {
      width: 100%;
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--card-dark);
      border: 1px dashed var(--border);
      border-radius: 22px;
    }

    .empty-state h3 {
      color: var(--text);
      font-size: 24px;
      margin-bottom: 10px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .nav-container {
        padding: 22px 20px;
        flex-direction: column;
        align-items: stretch;
      }

      .logo {
        font-size: 25px;
        text-align: center;
      }

      nav {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .nav-link {
        width: 100%;
        min-height: 54px;
        padding: 0 10px;
      }

      .container {
        padding: 38px 20px 60px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .stat-card {
        min-height: 150px;
      }

      .ea-list {
        grid-template-columns: 1fr;
      }

      .saved-section {
        padding: 22px;
      }
    }

    @media (max-width: 520px) {

      .container {
        padding: 32px 16px 55px;
      }

      .hero h1 {
        font-size: 44px;
      }

      .hero p {
        font-size: 20px;
      }

      .create-button {
        width: 100%;
      }

      .stat-card {
        padding: 28px;
      }

      .saved-section {
        padding: 18px;
        border-radius: 24px;
      }

      .saved-header {
        flex-direction: column;
        align-items: stretch;
      }

      .saved-header h2 {
        font-size: 30px;
      }

      .refresh-button {
        width: 100%;
      }

      .ea-card {
        padding: 20px;
      }

      .ea-name {
        font-size: 22px;
      }

      .ea-top {
        flex-direction: column;
      }

      .platform-badge {
        align-self: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav-container">

      <a href="index.html" class="logo">
        ALPHA <span>TRADERS HOST</span>
      </a>

      <nav>
        <a href="index.html" class="nav-link">
          Home
        </a>

        <a href="dashboard.html" class="nav-link active">
          Dashboard
        </a>
      </nav>

    </div>
  </header>


  <main>
    <div class="container">

      <section class="hero">

        <h1>Dashboard</h1>

        <p>
          Manage your Expert Advisors and view your saved EA configurations.
        </p>

        <a href="create-ea.html" class="create-button">
          + Create New EA
        </a>

      </section>


      <section class="stats-grid">

        <div class="stat-card">
          <div class="stat-number" id="totalEAs">0</div>
          <div class="stat-label">Total EAs</div>
        </div>

        <div class="stat-card">
          <div class="stat-number" id="mt4EAs">0</div>
          <div class="stat-label">MT4 EAs</div>
        </div>

        <div class="stat-card">
          <div class="stat-number" id="mt5EAs">0</div>
          <div class="stat-label">MT5 EAs</div>
        </div>

      </section>


      <section class="saved-section">

        <div class="saved-header">

          <h2>My Saved EAs</h2>

          <button
            type="button"
            class="refresh-button"
            id="refreshButton"
          >
            ↻ Refresh
          </button>

        </div>


        <div
          id="eaContent"
          class="status-message"
        >
          Loading your saved EAs...
        </div>

      </section>

    </div>
  </main>


  <script>

    /*
    ==================================================

      ALPHA TRADERS HOST
      DASHBOARD

      EXACT ea_robots TABLE:

      id
      mentor_id
      name
      description
      platform
      strategy
      risk_level
      version
      status
      created_at
      updated_at
      features

    ==================================================
    */


    const totalEAsElement =
      document.getElementById("totalEAs");

    const mt4EAsElement =
      document.getElementById("mt4EAs");

    const mt5EAsElement =
      document.getElementById("mt5EAs");

    const eaContent =
      document.getElementById("eaContent");

    const refreshButton =
      document.getElementById("refreshButton");


    /*
    ==================================================
      GET SUPABASE CLIENT
    ==================================================
    */

    function getSupabaseClient() {

      /*
        Recommended version from supabase-config.js:

        window.supabaseClient =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
          );
      */

      if (
        window.supabaseClient &&
        typeof window.supabaseClient
          .from === "function"
      ) {
        return window.supabaseClient;
      }


      /*
        Also supports a global client called
        supabaseClient.
      */

      try {

        if (
          typeof supabaseClient !== "undefined" &&
          supabaseClient &&
          typeof supabaseClient.from === "function"
        ) {
          return supabaseClient;
        }

      }
      catch (error) {
        console.error(
          "Supabase client check error:",
          error
        );
      }


      return null;

    }


    /*
    ==================================================
      ESCAPE HTML
    ==================================================
    */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
    ==================================================
      FORMAT PLATFORM
    ==================================================
    */

    function formatPlatform(platform) {

      if (!platform) {
        return "Not specified";
      }

      return String(platform)
        .trim()
        .toUpperCase();

    }


    /*
    ==================================================
      RESET STATISTICS
    ==================================================
    */

    function resetStatistics() {

      totalEAsElement.textContent = "0";
      mt4EAsElement.textContent = "0";
      mt5EAsElement.textContent = "0";

    }


    /*
    ==================================================
      UPDATE STATISTICS
    ==================================================
    */

    function updateStatistics(eas) {

      const robots =
        Array.isArray(eas)
          ? eas
          : [];


      const total =
        robots.length;


      const mt4 =
        robots.filter(function (ea) {

          return formatPlatform(
            ea.platform
          ) === "MT4";

        }).length;


      const mt5 =
        robots.filter(function (ea) {

          return formatPlatform(
            ea.platform
          ) === "MT5";

        }).length;


      totalEAsElement.textContent =
        total;

      mt4EAsElement.textContent =
        mt4;

      mt5EAsElement.textContent =
        mt5;

    }


    /*
    ==================================================
      LOAD DASHBOARD
    ==================================================
    */

    async function loadDashboard() {

      const client =
        getSupabaseClient();


      /*
      ----------------------------------------------
        SUPABASE NOT CONNECTED
      ----------------------------------------------
      */

      if (!client) {

        resetStatistics();

        eaContent.className =
          "status-message error-message";

        eaContent.innerHTML = `
          <strong>Supabase is not connected.</strong>

          <br><br>

          Check that
          <strong>supabase-config.js</strong>
          is in the same folder and creates
          <strong>window.supabaseClient</strong>.
        `;

        return;

      }


      /*
      ----------------------------------------------
        LOADING STATE
      ----------------------------------------------
      */

      eaContent.className =
        "status-message";

      eaContent.textContent =
        "Loading your saved EAs...";


      refreshButton.disabled = true;

      refreshButton.textContent =
        "Loading...";


      try {

        /*
        ==================================================
          GET CURRENT SESSION

          This must be the SAME logged-in user
          who created the EA.
        ==================================================
        */

        const {
          data: sessionData,
          error: sessionError
        } =
          await client.auth.getSession();


        if (sessionError) {
          throw sessionError;
        }


        const session =
          sessionData?.session;


        /*
        ----------------------------------------------
          NO LOGGED-IN USER
        ----------------------------------------------
        */

        if (!session || !session.user) {

          resetStatistics();

          eaContent.className =
            "status-message error-message";

          eaContent.innerHTML = `
            <strong>You are not logged in.</strong>

            <br><br>

            Please log in with the same account
            you used to create your Expert Advisors.

            <br><br>

            <a
              href="login.html"
              class="create-button"
              style="
                margin-top:0;
                min-height:54px;
                font-size:17px;
              "
            >
              Go to Login
            </a>
          `;

          return;

        }


        const user =
          session.user;


        console.log(
          "Dashboard logged-in user:",
          user.id
        );


        /*
        ==================================================
          LOAD EAS

          IMPORTANT:

          create-ea.html saves:

          mentor_id: currentUser.id

          Therefore the dashboard MUST use:

          mentor_id = session.user.id
        ==================================================
        */

        const {
          data: eas,
          error
        } =
          await client
            .from("ea_robots")
            .select(`
              id,
              mentor_id,
              name,
              description,
              platform,
              strategy,
              risk_level,
              version,
              status,
              created_at,
              updated_at,
              features
            `)
            .eq(
              "mentor_id",
              user.id
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {

          console.error(
            "Supabase ea_robots error:",
            error
          );

          throw error;

        }


        const robots =
          Array.isArray(eas)
            ? eas
            : [];


        console.log(
          "Loaded EAs:",
          robots
        );


        updateStatistics(
          robots
        );


        renderEAs(
          robots
        );


      }
      catch (error) {

        console.error(
          "Dashboard loading error:",
          error
        );


        resetStatistics();


        eaContent.className =
          "status-message error-message";


        eaContent.innerHTML = `
          <strong>Could not load your saved EAs.</strong>

          <br><br>

          ${escapeHTML(
            error.message ||
            "Unknown Supabase error"
          )}

          <br><br>

          <strong>Check:</strong>

          <br>
          • The table is named <strong>ea_robots</strong>
          <br>
          • You are logged in
          <br>
          • The saved EA has the correct <strong>mentor_id</strong>
          <br>
          • Your Supabase RLS policy allows SELECT
        `;

      }
      finally {

        refreshButton.disabled =
          false;

        refreshButton.textContent =
          "↻ Refresh";

      }

    }


    /*
    ==================================================
      RENDER EAS
    ==================================================
    */

    function renderEAs(eas) {

      /*
      ----------------------------------------------
        EMPTY STATE
      ----------------------------------------------
      */

      if (!eas || eas.length === 0) {

        eaContent.className = "";


        eaContent.innerHTML = `

          <div class="empty-state">

            <h3>
              No saved EAs yet
            </h3>

            <p>
              You do not currently have any
              Expert Advisors saved to your account.
            </p>

            <br>

            <a
              href="create-ea.html"
              class="create-button"
              style="
                margin-top:0;
                min-height:54px;
                font-size:17px;
              "
            >
              + Create New EA
            </a>

          </div>

        `;

        return;

      }


      /*
      ----------------------------------------------
        EA LIST
      ----------------------------------------------
      */

      let html =
        `<div class="ea-list">`;


      eas.forEach(function (ea) {

        const id =
          String(
            ea.id || ""
          );


        const name =
          escapeHTML(
            ea.name ||
            "Unnamed EA"
          );


        const platform =
          escapeHTML(
            formatPlatform(
              ea.platform
            )
          );


        const strategy =
          escapeHTML(
            ea.strategy ||
            "Not specified"
          );


        const riskLevel =
          escapeHTML(
            ea.risk_level ||
            "Not specified"
          );


        const version =
          escapeHTML(
            ea.version ||
            "1.0"
          );


        const status =
          escapeHTML(
            ea.status ||
            "draft"
          );


        const description =
          escapeHTML(
            ea.description ||
            "No description available."
          );


        html += `

          <article class="ea-card">

            <div class="ea-top">

              <div class="ea-name">
                ${name}
              </div>

              <div class="platform-badge">
                ${platform}
              </div>

            </div>


            <div class="ea-meta">

              <strong>Strategy:</strong>
              ${strategy}

              <br>

              <strong>Risk:</strong>
              ${riskLevel}

              <br>

              <strong>Version:</strong>
              ${version}

              <br>

              <strong>Status:</strong>
              ${status}

            </div>


            <p class="ea-description">
              ${description}
            </p>


            <div class="ea-actions">

              <button
                type="button"
                class="edit-button"
                data-ea-id="${escapeHTML(id)}"
              >
                ✏ Edit EA
              </button>


              <button
                type="button"
                class="view-button"
                data-view-id="${escapeHTML(id)}"
              >
                View Details
              </button>

            </div>

          </article>

        `;

      });


      html +=
        `</div>`;


      eaContent.className =
        "";


      eaContent.innerHTML =
        html;


      /*
      ----------------------------------------------
        EDIT BUTTON EVENTS
      ----------------------------------------------
      */

      document
        .querySelectorAll(
          "[data-ea-id]"
        )
        .forEach(function (button) {

          button.addEventListener(
            "click",
            function () {

              const id =
                button.dataset.eaId;

              editEA(id);

            }
          );

        });


      /*
      ----------------------------------------------
        VIEW BUTTON EVENTS
      ----------------------------------------------
      */

      document
        .querySelectorAll(
          "[data-view-id]"
        )
        .forEach(function (button) {

          button.addEventListener(
            "click",
            function () {

              const id =
                button.dataset.viewId;

              viewEA(id);

            }
          );

        });

    }


    /*
    ==================================================
      EDIT EA
    ==================================================
    */

    function editEA(id) {

      if (!id) {

        alert(
          "EA ID could not be found."
        );

        return;

      }


      window.location.href =
        "create-ea.html?id=" +
        encodeURIComponent(id);

    }


    /*
    ==================================================
      VIEW EA DETAILS
    ==================================================
    */

    async function viewEA(id) {

      const client =
        getSupabaseClient();


      if (!client) {

        alert(
          "Supabase is not connected."
        );

        return;

      }


      if (!id) {

        alert(
          "EA ID could not be found."
        );

        return;

      }


      try {

        /*
          Get the current user first.
          This ensures users only view
          their own EA.
        */

        const {
          data: sessionData
        } =
          await client.auth.getSession();


        const user =
          sessionData?.session?.user;


        if (!user) {

          alert(
            "Please log in first."
          );

          return;

        }


        const {
          data,
          error
        } =
          await client
            .from("ea_robots")
            .select(`
              name,
              description,
              platform,
              strategy,
              risk_level,
              version,
              status,
              features,
              created_at
            `)
            .eq("id", id)
            .eq(
              "mentor_id",
              user.id
            )
            .single();


        if (error) {
          throw error;
        }


        const features =
          data.features
            ? JSON.stringify(
                data.features,
                null,
                2
              )
            : "No features configured";


        alert(

          "EA DETAILS\n\n" +

          "Name: " +
          (data.name || "Unnamed EA") +

          "\n\nPlatform: " +
          formatPlatform(
            data.platform
          ) +

          "\nStrategy: " +
          (data.strategy || "Not specified") +

          "\nRisk Level: " +
          (data.risk_level || "Not specified") +

          "\nVersion: " +
          (data.version || "1.0") +

          "\nStatus: " +
          (data.status || "draft") +

          "\n\nDescription:\n" +
          (
            data.description ||
            "No description"
          ) +

          "\n\nFeatures:\n" +
          features

        );

      }
      catch (error) {

        console.error(
          "View EA error:",
          error
        );


        alert(
          "Could not load EA details: " +
          (
            error.message ||
            "Unknown error"
          )
        );

      }

    }


    /*
    ==================================================
      REFRESH
    ==================================================
    */

    refreshButton.addEventListener(
      "click",
      function () {

        loadDashboard();

      }
    );


    /*
    ==================================================
      INITIAL LOAD
    ==================================================
    */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        loadDashboard();

      }
    );


    /*
    ==================================================
      AUTH STATE CHANGE

      Automatically reload the dashboard
      when the user logs in or logs out.
    ==================================================
    */

    const initialClient =
      getSupabaseClient();


    if (
      initialClient &&
      initialClient.auth
    ) {

      initialClient.auth.onAuthStateChange(
        function () {

          loadDashboard();

        }
      );

    }

  </script>

</body>
</html>
